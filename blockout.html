            const a = pointAt(p, q, t0), b = pointAt(p, q, t1);
            deck.addWall(a, b, BRIDGE_DECK_BOTTOM, 0, outward); // the sidewalk's own edge already covers 0 up to its top
            railAlong(rails, a, b, outward, Y_SIDEWALK, ROAD_RAILING_STYLE, state);
          });
        });
        // piers: a slab across the road every so often along its centerline, wherever that's well out over the water
        strokes.forEach(({ path, hw }) => {
          const pts = path.map(p => ({ x: p.X/CLIPPER_SCALE, z: p.Y/CLIPPER_SCALE }));
          let untilNext = BRIDGE_PIER_SPACING/2;
          for (let i=0;i<pts.length-1;i++) {
            const a = pts[i], b = pts[i+1], len = Math.hypot(b.x-a.x, b.z-a.z);
            if (len < 1e-6) continue;
            const dx = (b.x-a.x)/len, dz = (b.z-a.z)/len;
            let s = untilNext;
            for (; s <= len; s += BRIDGE_PIER_SPACING) {
              const x = a.x + dx*s, z = a.z + dz*s, across = hw + 1;
              const clear = [[0,0], [dx*2.5, dz*2.5], [-dx*2.5, -dz*2.5], [-dz*across, dx*across], [dz*across, -dx*across]].every(([ox, oz]) => inWater(x+ox, z+oz));
              if (clear) deck.addBox(x, z, -dz, dx, hw*0.7, 0.6, WATER_BANK_BOTTOM, BRIDGE_DECK_BOTTOM);
            }
            untilNext = s - len;
          }
        });
      });
      const wood = createMeshBuilder(), woodRails = createMeshBuilder();
      pathBridgeSources.forEach(({ strokes }) => {
        const outline = unionRoadStrokes(strokes);
        const over = clipPolygons(ctIntersection, outline, region, true);
        if (!over.Childs().length) return;
        wood.addTops(over, FOOTBRIDGE_TOP);
        wood.addTops(over, FOOTBRIDGE_TOP - FOOTBRIDGE_THICKNESS, true);
        const trackEdges = createEdgeIndex(outline), state = {};
        forEachPolyTreeEdge(over, (p, q, outward) => {
          wood.addWall(p, q, FOOTBRIDGE_TOP - FOOTBRIDGE_THICKNESS, FOOTBRIDGE_TOP, outward);
          trackEdges.coverage(p, q).forEach(([t0, t1]) => railAlong(woodRails, pointAt(p, q, t0), pointAt(p, q, t1), outward, FOOTBRIDGE_TOP, WOOD_RAILING_STYLE, state));
        });
      });
      [[deck, BRIDGE_COLOR, 0.9, 0, 'Bridge'], [rails, ROAD_RAILING_STYLE.color, 0.45, 0.6, 'BridgeRailing'],
       [wood, FOOTBRIDGE_COLOR, 0.9, 0, 'Footbridge'], [woodRails, WOOD_RAILING_STYLE.color, 0.9, 0, 'FootbridgeRailing']].forEach(([builder, color, roughness, metalness, name]) => {
        const geo = builder.build();
        if (!geo) return;
        const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness, metalness }));
        mesh.castShadow = true; mesh.receiveShadow = true;
        mesh.name = name;
        bridgeGroup.add(mesh);
      });
    }
    scene.add(bridgeGroup);
  }

  function roadHighlightColor(baseColorHex) {
    const c = new THREE.Color(baseColorHex);
    const hsl = {}; c.getHSL(hsl);
    const targetHue = 0.14; // yellow
    const hue = hsl.h + (targetHue - hsl.h) * 0.22;
    const sat = THREE.MathUtils.clamp(hsl.s*0.85 + 0.1, 0, 1);
    const light = THREE.MathUtils.clamp(hsl.l + 0.13, 0, 0.85);
    return new THREE.Color().setHSL(hue, sat, light);
  }
  function refreshHighlights() {
    const selectedNetwork = (selection.type==='road' || selection.type==='train') ? selection.id : null;
    roadMeshGroup.children.concat(trainMeshGroup.children).forEach(m => {
      if (!m.userData || m.material==null) return;
      const baseColor = m.userData.baseColor!=null ? m.userData.baseColor : ROAD_COLOR;
      if (m.userData.networkId!=null && selectedNetwork!=null && m.userData.networkId===selectedNetwork) {
        m.material.color.copy(roadHighlightColor(baseColor));
      } else {
        m.material.color.set(baseColor);
      }
    });
    if (hoveredRoadLineId!=null) {
      roadMeshGroup.children.forEach(m => { if (m.userData && m.userData.lineId===hoveredRoadLineId && m.material) m.material.color.set(0xffffff); });
    }
  }
  function styleZoneVisual(zone) {
    if (!zone.outlineGroup) return;
    const isSel = selection.type==='zone' && selection.id===zone.id;
    const isHover = hoveredZoneId===zone.id;
    zone.outlineGroup.children.forEach(c => {
      if (c.userData && c.userData.isZoneFill) {
        c.material.color.set(isHover?0xffd23d:(isSel?0xffffff:0x3ddc97));
        c.material.opacity = isHover?0.18:(isSel?0.13:0.07);
      } else if (c.userData && c.userData.isZoneLine) {
        c.material.color.set(isHover?0xffd23d:(isSel?0xffffff:0x3ddc97));
      }
    });
  }

  let hoveredRoadLineId = null;
  let hoveredZoneId = null;
  function setRoadHover(lineId) {
    if (hoveredRoadLineId === lineId) return;
    hoveredRoadLineId = lineId;
    refreshHighlights();
  }
  function setZoneHover(zoneId) {
    if (hoveredZoneId === zoneId) return;
    const prevZone = zones.find(z=>z.id===hoveredZoneId);
    hoveredZoneId = zoneId;
    if (prevZone) styleZoneVisual(prevZone);
    const zone = zones.find(z=>z.id===zoneId);
    if (zone) styleZoneVisual(zone);
  }

  // ============================================================ selection / hierarchy
  function selectItem(type,id,force) {
    if (!force && selection.type===type && selection.id===id) { deselect(); return; }
    selection = { type, id };
    currentTool = type;
    colorPickerState = null;
    if (type==='road') lastSelectedRoadNetworkId = id;
    else if (type==='zone') lastSelectedZoneId = id;
    else if (type==='train') lastSelectedTrainNetworkId = id;
    refreshHighlights();
    zones.forEach(rebuildZoneVisual);
    rebuildRoadMarkers(); rebuildRoadHandles(); // the tab may have changed, and each tab only shows its own kind of node
    applyModeVisibility();
    renderHierarchy();
  }
  function deselect() {
    selection = { type:null, id:null };
    colorPickerState = null;
    refreshHighlights();
    zones.forEach(rebuildZoneVisual);
    renderHierarchy();
  }
  function removeRoadNetwork(networkId) {
    const removedIds = roadLines.filter(l=>l.networkId===networkId).map(l=>l.id);
    roadLines = roadLines.filter(l => l.networkId!==networkId);
    if (activeRoadLine && removedIds.includes(activeRoadLine.id)) activeRoadLine=null;
    if ((selection.type==='road' || selection.type==='train') && selection.id===networkId) selection={type:null,id:null};
    cleanupOrphanRoadNodes();
    rebuildRoadMeshes();
    zones.forEach(subdivideZone);
    renderHierarchy();
  }
  function removeZone(id) {
    const zone = zones.find(z=>z.id===id);
    if (!zone) return;
    const index = zones.indexOf(zone);
    zones = zones.filter(z=>z.id!==id);
    if (zone.outlineGroup) { scene.remove(zone.outlineGroup); disposeObject(zone.outlineGroup); }
    if (zone.buildingsGroup) { scene.remove(zone.buildingsGroup); disposeObject(zone.buildingsGroup); }
    if (activeZone && activeZone.id===id) activeZone=null;
    if (selection.id===id) selection={type:null,id:null};
    if (!zone.drawing) subdivideZonesFromIndex(index); // the zones below get back what it was cutting out of them
    renderHierarchy();
    updateStats();
  }
  function deleteRoadNode(id) {
    delete roadNodes[id];
    for (let i=roadLines.length-1;i>=0;i--) {
      const line = roadLines[i];
      const idx = line.nodeIds.indexOf(id);
      if (idx!==-1) line.nodeIds.splice(idx,1);
      if (line.nodeIds.length<2) roadLines.splice(i,1);
    }
    if ((selection.type==='road' || selection.type==='train') && !roadLines.some(l=>l.networkId===selection.id)) selection={type:null,id:null};
    rebuildRoadMeshes();
    zones.forEach(subdivideZone);
    renderHierarchy();
  }
  function deleteZoneVertex(zone, idx) {
    zone.points.splice(idx,1);
    if (zone.points.length<3) { removeZone(zone.id); return; }
    subdivideZonesFrom(zone);
    rebuildZoneVisual(zone);
    renderHierarchy();
  }

  function renderHierarchy() {
    // road and train networks both live in roadLines, each listed in its own tab
    [['road', 'roads-list', 'roads-count'], ['train', 'trains-list', 'trains-count']].forEach(([kind, listId, countId]) => {
      const list = document.getElementById(listId);
      list.innerHTML='';
      const networks = [];
      const seenNetworks = new Set();
      roadLines.forEach(line => {
        if (networkKindOf(line)!==kind || seenNetworks.has(line.networkId)) return;
        seenNetworks.add(line.networkId);
        networks.push(line.networkId);
      });
      networks.forEach(netId => {
        const lines = roadLines.filter(l=>l.networkId===netId);
        const row = document.createElement('div');
        row.className = 'hier-row' + (selection.type===kind&&selection.id===netId?' active':'');
        const span = document.createElement('span');
        span.textContent = lines.length>1
          ? `${netId} · ${lines.length} branches`
          : lines[0].id;
        row.appendChild(span);
        const del = document.createElement('button');
        del.className='hier-del'; del.textContent='×';
        del.onclick = (e)=>{ e.stopPropagation(); removeRoadNetwork(netId); };
        row.appendChild(del);
        row.onclick = ()=> selectItem(kind, netId);
        list.appendChild(row);
      });
      document.getElementById(countId).textContent = networks.length;
    });

    const zonesList = document.getElementById('zones-list');
    zonesList.innerHTML='';
    zones.forEach(zone => {
      const row = document.createElement('div');
      row.className = 'hier-row' + (selection.type==='zone'&&selection.id===zone.id?' active':'');
      const span = document.createElement('span');
      span.textContent = zone.name + (zone.drawing?' (drawing…)':'');
      row.appendChild(span);
      const del = document.createElement('button');
      del.className='hier-del'; del.textContent='×';
      del.onclick = (e)=>{ e.stopPropagation(); removeZone(zone.id); };
      row.appendChild(del);
      row.onclick = ()=> selectItem('zone', zone.id);
      // drag to reorder: higher in the list = higher priority, cutting into every zone below
      row.draggable = !zone.drawing;
      row.addEventListener('dragstart', (e) => {
        draggedZoneId = zone.id;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', zone.id);
      });
      row.addEventListener('dragend', () => { if (draggedZoneId) { draggedZoneId = null; renderHierarchy(); } });
      row.addEventListener('dragover', (e) => {
        if (!draggedZoneId || draggedZoneId===zone.id) return;
        e.preventDefault();
        const rect = row.getBoundingClientRect(), before = e.clientY < rect.top + rect.height/2;
        row.classList.toggle('drop-before', before);
        row.classList.toggle('drop-after', !before);
      });
      row.addEventListener('dragleave', () => row.classList.remove('drop-before', 'drop-after'));
      row.addEventListener('drop', (e) => {
        if (!draggedZoneId) return;
        e.preventDefault();
        moveZone(draggedZoneId, zone.id, row.classList.contains('drop-before'));
      });
      zonesList.appendChild(row);
    });
    document.getElementById('zones-count').textContent = zones.length;

    syncRoadWidthUI();
    syncSidewalkWidthUI();
    syncTrainRadiusUI();
    renderDetails();
    updateStats();
  }

  function syncRoadWidthUI() {
    const widthInput = document.getElementById('s-roadwidth');
    const widthVal = document.getElementById('v-roadwidth');
    const ctx = document.getElementById('rw-context');
    if (selection.type==='road') {
      const line = roadLines.find(l=>l.networkId===selection.id);
      if (line) {
        widthInput.value = line.width;
        widthVal.textContent = line.width;
        ctx.textContent = '· '+selection.id;
        return;
      }
    }
    widthInput.value = DEFAULT_ROAD_WIDTH;
    widthVal.textContent = DEFAULT_ROAD_WIDTH;
    ctx.textContent = '· new roads';
  }
  function syncSidewalkWidthUI() {
    const widthInput = document.getElementById('s-sidewalkwidth');
    const widthVal = document.getElementById('v-sidewalkwidth');
    const ctx = document.getElementById('sw-context');
    if (selection.type==='road') {
      const line = roadLines.find(l=>l.networkId===selection.id);
      if (line) {
        const v = line.sidewalkWidth!=null ? line.sidewalkWidth : DEFAULT_SIDEWALK_WIDTH;
        widthInput.value = v;
        widthVal.textContent = v;
        ctx.textContent = '· '+selection.id;
        return;
      }
    }
    widthInput.value = DEFAULT_SIDEWALK_WIDTH;
    widthVal.textContent = DEFAULT_SIDEWALK_WIDTH;
    ctx.textContent = '· new roads';
  }

  function syncTrainRadiusUI() {
    const line = selection.type==='train' ? roadLines.find(l=>l.networkId===selection.id) : null;
    const v = line ? (line.radius || TRAIN_DEFAULT_RADIUS) : TRAIN_DEFAULT_RADIUS;
    document.getElementById('s-tuberadius').value = v;
    document.getElementById('v-tuberadius').textContent = v;
    document.getElementById('tr-context').textContent = line ? '· '+selection.id : '· new lines';
  }

  // Generic dual-handle range slider — two overlapping native <input type=range> (see the
  // .range-slider CSS for how clicks reach whichever handle is under the cursor) plus a green
  // fill bar between them. `id` must be unique within whatever panel renders it.
  function rangeSliderHtml(id, label, min, max, step, valLo, valHi, decimals) {
    const fmt = v => decimals!=null ? Number(v).toFixed(decimals) : v;
    return `
      <div class="slider-row">
        <div class="row"><label>${label}</label><span class="val" id="dv-${id}">${fmt(valLo)}–${fmt(valHi)}</span></div>
        <div class="range-slider">
          <div class="range-track"></div>
          <div class="range-fill" id="rf-${id}"></div>
          <input type="range" id="rs-${id}-lo" min="${min}" max="${max}" step="${step}" value="${valLo}">
          <input type="range" id="rs-${id}-hi" min="${min}" max="${max}" step="${step}" value="${valHi}">
        </div>
      </div>
    `;
  }
  function updateRangeFillVisual(id, min, max) {
    const lo = parseFloat(document.getElementById(`rs-${id}-lo`).value);
    const hi = parseFloat(document.getElementById(`rs-${id}-hi`).value);
    const fill = document.getElementById(`rf-${id}`);
    const loPct = (lo-min)/(max-min)*100, hiPct = (hi-min)/(max-min)*100;
    fill.style.left = loPct+'%';
    fill.style.width = Math.max(0, hiPct-loPct)+'%';
  }
  function wireRangeSlider(id, min, max, decimals, onChange) {
    // onChange(lo, hi) fires on every move, after clamping lo<=hi by pushing whichever handle
    // got crossed along with it — the same "push the other one" behavior this app's existing
    // single-slider min/max pairs already use (see heightMin/heightMax historically).
    const loInput = document.getElementById(`rs-${id}-lo`);
    const hiInput = document.getElementById(`rs-${id}-hi`);
    const dv = document.getElementById(`dv-${id}`);
    const fmt = v => decimals!=null ? Number(v).toFixed(decimals) : v;
    function apply(movedLo) {
      let lo = parseFloat(loInput.value), hi = parseFloat(hiInput.value);
      if (lo > hi) {
        if (movedLo) { hi = lo; hiInput.value = hi; } else { lo = hi; loInput.value = lo; }
      }
      dv.textContent = `${fmt(lo)}–${fmt(hi)}`;
      updateRangeFillVisual(id, min, max);
      onChange(lo, hi);
    }
    loInput.addEventListener('input', () => apply(true));
    hiInput.addEventListener('input', () => apply(false));
    updateRangeFillVisual(id, min, max);
  }

  // shared by any zone type that exposes a ground color (buildings, plain)
  // generic extendable-palette swatch row, shared by anything with a "pick a color" control
  // (zone ground color, road color, park grass tint, tree tint, ...). A single detail panel can
  // now show more than one of these rows at once (a park zone has both Grass tint and Tree
  // tint), so each row is tagged with its own `key` — colorPickerState carries that key too, so
  // opening the add/edit picker on one row never touches the other row's elements or state, and
  // element ids are suffixed with the key so two rows' "+"/confirm/cancel controls never collide.
  function colorSwatchRowHtml(palette, currentHex, key) {
    key = key || 'default';
    const isOpen = colorPickerState && colorPickerState.key === key;
    return `
      <div class="swatch-row" data-palette-key="${key}">
        ${palette.map((c,i) => `
          <div class="swatch-wrap">
            <button class="swatch${c===currentHex?' active':''}" data-swatchcolor="${c}" title="Double-click to edit" style="background:#${c.toString(16).padStart(6,'0')}"></button>
            ${palette.length>1 ? `<button class="swatch-delete" data-deleteindex="${i}" title="Remove this color">&times;</button>` : ''}
          </div>
        `).join('')}
        ${isOpen ? `
          <div class="add-color-row">
            <input type="color" class="color-input" id="d-addcolor-input-${key}" value="#${(colorPickerState.mode==='edit'?palette[colorPickerState.index]:0x888888).toString(16).padStart(6,'0')}">
            <button class="add-color-confirm" id="d-addcolor-confirm-${key}">${colorPickerState.mode==='edit'?'OK':'Add'}</button>
            <button class="add-color-cancel" id="d-addcolor-cancel-${key}" title="Cancel">&times;</button>
          </div>
        ` : `<button class="swatch swatch-add" id="d-addcolor-${key}" title="Add custom color">+</button>`}
      </div>
    `;
  }
  function wireColorSwatchEvents(panel, palette, opts, key, rerender, currentHex) {
    // opts: { onPick(hex), onCommit(hex, mode, oldHexIfEdit), onRemove(oldHex, fallbackHex),
    //         onPreview(hex) — optional, called live on every drag tick of the open native
    //         picker (both add and edit) so a caller that wants to see the change land in the
    //         3D view as they drag can apply it immediately without waiting for Add/OK. }
    // Clicking "+" or double-clicking a swatch immediately opens the native picker (a .click()
    // on the now-visible color input, still inside the same user-gesture call stack) instead of
    // making the user click twice — once to reveal it, again to actually open it. The click is
    // deferred one frame: firing it in the same tick as the innerHTML swap that just created the
    // input can catch the browser before it's laid the element out, which is what made the
    // picker occasionally anchor to the top-left of the screen instead of the actual swatch.
    key = key || 'default';
    // rerender: which render function redraws this row's own panel — defaults to the zone/road
    // details panel, since that's every existing caller; the World section's tint rows pass
    // renderWorldTintPanel instead so opening/closing their picker redraws the right panel.
    rerender = rerender || renderDetails;
    function openPickerNextFrame() {
      requestAnimationFrame(() => {
        const input = document.getElementById('d-addcolor-input-'+key);
        if (input) input.click();
      });
    }
    // scoped to this row only — a panel with multiple swatch rows (e.g. a park's Grass tint +
    // Tree tint) must not have one row's wiring pick up another row's buttons.
    const row = panel.querySelector(`[data-palette-key="${key}"]`);
    if (!row) return;
    row.querySelectorAll('[data-swatchcolor]').forEach(btn => {
      btn.addEventListener('click', () => opts.onPick(parseInt(btn.dataset.swatchcolor, 10)));
      btn.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        const hex = parseInt(btn.dataset.swatchcolor, 10);
        colorPickerState = { key, mode:'edit', index: palette.indexOf(hex) };
        rerender();
        openPickerNextFrame();
      });
    });
    row.querySelectorAll('[data-deleteindex]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.deleteindex, 10);
        const oldHex = palette[idx];
        palette.splice(idx, 1);
        opts.onRemove(oldHex, palette[0]);
        colorPickerState = null;
        rerender();
      });
    });
    if (colorPickerState && colorPickerState.key === key) {
      if (opts.onPreview) {
        document.getElementById('d-addcolor-input-'+key).addEventListener('input', (e) => {
          opts.onPreview(parseInt(e.target.value.slice(1), 16));
        });
      }
      document.getElementById('d-addcolor-confirm-'+key).addEventListener('click', () => {
        const hex = parseInt(document.getElementById('d-addcolor-input-'+key).value.slice(1), 16);
        if (colorPickerState.mode==='edit') {
          const oldHex = palette[colorPickerState.index];
          palette[colorPickerState.index] = hex;
          opts.onCommit(hex, 'edit', oldHex);
        } else {
          if (!palette.includes(hex)) palette.push(hex);
          opts.onCommit(hex, 'add', null);
        }
        colorPickerState = null;
        rerender();
      });
      document.getElementById('d-addcolor-cancel-'+key).addEventListener('click', () => {
        // undo whatever was live-previewed while dragging — the picker never actually committed
        if (opts.onPreview && currentHex!=null) opts.onPreview(currentHex);
        colorPickerState = null;
        rerender();
      });
    } else {
      const addBtn = document.getElementById('d-addcolor-'+key);
      if (addBtn) addBtn.addEventListener('click', () => {
        colorPickerState = { key, mode:'add' };
        rerender();
        openPickerNextFrame();
      });
    }
  }
  // World-section grass/tree tint — the default every park's grass and every tree falls back to
  // unless a park zone turns on its own "Custom color" override (see the park zoneType branch in
  // renderDetails). Lives in its own panel/render function since it's outside the zone/road
  // details panel entirely.
  function renderWorldTintPanel() {
    const panel = document.getElementById('world-tint-panel');
    panel.innerHTML = `
      <div class="section-label">Grass tint</div>
      ${colorSwatchRowHtml(PARK_TINT_COLORS, globalParkTint, 'worldparktint')}
      <div class="section-label">Tree tint</div>
      ${colorSwatchRowHtml(TREE_TINT_COLORS, globalTreeTint, 'worldtreetint')}
    `;
    wireColorSwatchEvents(panel, PARK_TINT_COLORS, {
      onPick: (hex) => { globalParkTint = hex; zones.forEach(subdivideZone); renderWorldTintPanel(); },
      onCommit: (hex, mode, oldHex) => {
        if (mode==='edit') {
          if (globalParkTint===oldHex) globalParkTint = hex;
          zones.forEach(z => { if (z.settings && z.settings.parkTint===oldHex) z.settings.parkTint = hex; });
        } else {
          globalParkTint = hex;
        }
        zones.forEach(subdivideZone);
      },
      onRemove: (oldHex, fallback) => {
        if (globalParkTint===oldHex) globalParkTint = fallback;
        zones.forEach(z => { if (z.settings && z.settings.parkTint===oldHex) z.settings.parkTint = fallback; });
        zones.forEach(subdivideZone);
      },
      onPreview: (hex) => { globalParkTint = hex; zones.forEach(subdivideZone); }
    }, 'worldparktint', renderWorldTintPanel, globalParkTint);
    wireColorSwatchEvents(panel, TREE_TINT_COLORS, {
      onPick: (hex) => { globalTreeTint = hex; zones.forEach(subdivideZone); renderWorldTintPanel(); },
      onCommit: (hex, mode, oldHex) => {
        if (mode==='edit') {
          if (globalTreeTint===oldHex) globalTreeTint = hex;
          zones.forEach(z => { if (z.settings && z.settings.treeTint===oldHex) z.settings.treeTint = hex; });
        } else {
          globalTreeTint = hex;
        }
        zones.forEach(subdivideZone);
      },
      onRemove: (oldHex, fallback) => {
        if (globalTreeTint===oldHex) globalTreeTint = fallback;
        zones.forEach(z => { if (z.settings && z.settings.treeTint===oldHex) z.settings.treeTint = fallback; });
        zones.forEach(subdivideZone);
      },
      onPreview: (hex) => { globalTreeTint = hex; zones.forEach(subdivideZone); }
    }, 'worldtreetint', renderWorldTintPanel, globalTreeTint);
  }
  function renderDetails() {
    const panel = document.getElementById('details-panel');
    if (selection.type==='zone') {
      const zone = zones.find(z=>z.id===selection.id);
      if (!zone) { panel.innerHTML = '<div class="empty">Select a road or zone from the list to see its settings.</div>'; return; }

      const wireSwatches = (palette, key, swatchKey, fallback) => wireColorSwatchEvents(panel, palette, {
        onPick: (hex) => { s[key] = hex; subdivideZone(zone); renderDetails(); },
        onCommit: (hex, mode, oldHex) => {
          if (mode==='edit') zones.forEach(z => { if (z.settings && z.settings[key]===oldHex) { z.settings[key]=hex; subdivideZone(z); } });
          else { s[key] = hex; subdivideZone(zone); }

        onRemove: (oldHex, replacement) => { zones.forEach(z => { if (z.settings && z.settings[key]===oldHex) { z.settings[key]=replacement; subdivideZone(z); } }); },
        onPreview: (hex) => { s[key] = hex; subdivideZone(zone); }

      if (zoneType==='water') {

            } else {

      } else {

    } else if (selection.type==='road') {

      const curColor = lines[0].color!=null ? lines[0].color : ROAD_COLOR;

      if (isPath) {

      wireColorSwatchEvents(panel, SIDEWALK_COLOR_PALETTE, {

      }, 'sidewalkcolor', renderDetails, curSidewalkColor);

    } else if (selection.type==='train') {
      const netId = selection.id;
      const lines = roadLines.filter(l=>l.networkId===netId);
      if (!lines.length) { panel.innerHTML = '<div class="empty">Select a road or zone from the list to see its settings.</div>'; return; }
      const nodeIds = new Set(lines.flatMap(l => l.nodeIds));
      const stations = [...nodeIds].filter(id => roadNodes[id] && roadNodes[id].type==='station').length;
      const title = lines.length>1 ? netId : lines[0].id;
      panel.innerHTML = `
        <div class="title-row"><span class="name">${title}</span><button class="close-x" id="d-close">deselect</button></div>
        <div class="empty" style="margin-bottom:10px;">${nodeIds.size} nodes · ${stations} station${stations===1?'':'s'}</div>
        <button class="btn danger" id="d-delete">Delete train line${lines.length>1?'s':''}</button>
      `;
      document.getElementById('d-delete').addEventListener('click', ()=> removeRoadNetwork(netId));
      document.getElementById('d-close').addEventListener('click', deselect);
    } else {
      panel.innerHTML = '<div class="empty">Select a road or zone from the list to see its settings.</div>';
    }
  }

  // ============================================================ tool switching / drawing lifecycle
  function cancelActiveDrawing() {
    lastGroundClick = null;
    lastNodeClick = null;
    if (activeRoadLine) {
      roadLines = roadLines.filter(l=>l.id!==activeRoadLine.id);
      cleanupOrphanRoadNodes();
      activeRoadLine=null;
      rebuildRoadMeshes();
      zones.forEach(subdivideZone);
    }
    if (activeZone) {
      zones = zones.filter(z=>z.id!==activeZone.id);
      if (activeZone.outlineGroup) { scene.remove(activeZone.outlineGroup); disposeObject(activeZone.outlineGroup); }
      activeZone=null;
      renderHierarchy();
    }
    previewLine.visible=false;
  }
  function closeActiveZone() {
    activeZone.closed=true; activeZone.drawing=false;
    const finished=activeZone; activeZone=null;
    subdivideZonesFrom(finished);
    previewLine.visible=false;
    selectItem('zone', finished.id, true);
  }
  function finishActiveDrawing() {
    lastGroundClick = null;
    if (activeRoadLine) {
      if (activeRoadLine.nodeIds.length<2) { cancelActiveDrawing(); return; }
      const finishedLine = activeRoadLine;
      finishedLine.drawing=false;
      activeRoadLine=null;
      rebuildRoadMeshes();
      previewLine.visible=false;
      selectItem(networkKindOf(finishedLine), finishedLine.networkId, true);
    }
    if (activeZone) {
      if (activeZone.points.length<3) return;
      closeActiveZone();
    }
  }
  function updateHint() {
    let msg;
    if (interactionMode==='move') {
      msg = 'Left-drag to orbit · shift+left-drag to pan · scroll to zoom · 1/3/7 for view snaps';
    } else if (interactionMode==='maps') {
      if (mapTransform) {
        const label = mapTransform.mode==='translate' ? 'Move' : mapTransform.mode==='rotate' ? 'Rotate' : 'Scale';
        const snapHint = mapTransform.mode==='rotate' ? ' · hold shift to snap to 90°' : '';
        msg = label+' — click or Enter to confirm · Esc or right-click to cancel'+snapHint;
      } else {
        msg = 'Click an image to select it · G move · R rotate · S scale · empty-ground drag orbits';
      }
    } else {
      const hints = {
        train: "Click to place nodes at the line's height · drag a node to move it in 3D (top view, key 7, moves it level) · alt+drag changes only its height · right-click a node to make it a station · double-click a node to delete it · double-click or Enter finishes · shift+click a line to insert a node · Esc cancels",
        road:'Click ground to place nodes · click a node to select its road · double-click a node to delete it · drag to move · empty-ground drag orbits · double-click ground or Enter finishes · shift+click a road to insert a node · Esc cancels',
        zone: 'Click ground for boundary points · click a point to select its zone · double-click a point to delete it · drag to move · empty-ground drag orbits · double-click ground, click first point, or Enter (3+ points) to close · shift+click an edge to insert a point · Esc cancels'
      };
      msg = hints[currentTool];
    }
    document.getElementById('hint').textContent = msg;
  }
  function applyModeVisibility() {
    hideContextMenu();
    roadMarkerGroup.visible = (interactionMode==='node');
    roadHandleGroup.visible = (interactionMode==='node');
    zones.forEach(z => {
      if (z.outlineGroup) z.outlineGroup.visible = (interactionMode==='node');
    });
    const inNode = interactionMode==='node';
    document.getElementById('section-road').style.display = (inNode && currentTool==='road') ? 'block' : 'none';
    document.getElementById('section-zone').style.display = (inNode && currentTool==='zone') ? 'block' : 'none';
    document.getElementById('section-train').style.display = (inNode && currentTool==='train') ? 'block' : 'none';
    document.getElementById('entity-toolbar').style.display = inNode ? 'flex' : 'none';
    document.getElementById('details-panel').style.display = inNode ? 'block' : 'none';
    document.getElementById('section-move').style.display = interactionMode==='move' ? 'block' : 'none';
    document.getElementById('section-maps').style.display = interactionMode==='maps' ? 'block' : 'none';
    document.querySelectorAll('#mode-toolbar .tool-btn').forEach(b => b.classList.toggle('active', b.dataset.mode===interactionMode));
    document.querySelectorAll('#entity-toolbar .tool-btn').forEach(b => b.classList.toggle('active', b.dataset.entity===currentTool));
    updateHint();
  }
  function setMode(mode) {
    lastGroundClick = null;
    cancelActiveDrawing();
    setHover(null);
    if (hoveredRoadLineId!=null) { hoveredRoadLineId=null; refreshHighlights(); }
    if (hoveredZoneId!=null) { const z=zones.find(z=>z.id===hoveredZoneId); hoveredZoneId=null; if (z) styleZoneVisual(z); }
    insertPreviewMarker.visible = false;
    if (mode==='move' && selection.type) {
      selection = { type:null, id:null };
      refreshHighlights();
      zones.forEach(rebuildZoneVisual);
    }
    if (mode!=='maps') { hoveredMapId = null; setSelectedMap(null); }
    interactionMode = mode;
    applyModeVisibility();
    renderHierarchy();
  }
  function setEntityTab(tab) {
    lastGroundClick = null;
    cancelActiveDrawing();
    setHover(null);
    insertPreviewMarker.visible = false;
    currentTool = tab;
    rebuildRoadMarkers(); rebuildRoadHandles(); // each tab only shows its own kind of node
    applyModeVisibility();
    renderHierarchy();
  }
  document.querySelectorAll('#mode-toolbar .tool-btn').forEach(b => b.addEventListener('click', ()=> setMode(b.dataset.mode)));
  document.querySelectorAll('#entity-toolbar .tool-btn').forEach(b => b.addEventListener('click', ()=> setEntityTab(b.dataset.entity)));

  document.getElementById('s-roadwidth').addEventListener('input', (e)=>{

  document.getElementById('btn-clear').addEventListener('click', ()=>{
    cancelActiveDrawing();
    roadLines=[]; Object.keys(roadNodes).forEach(k=>delete roadNodes[k]);
    zones.forEach(z=>{ scene.remove(z.outlineGroup); disposeObject(z.outlineGroup); scene.remove(z.buildingsGroup); disposeObject(z.buildingsGroup); });
    zones=[];
    selection={type:null,id:null};
    mapImages.slice().forEach(m => removeMapImage(m.id));

    renderHierarchy();
  });
  document.getElementById('btn-import-image').addEventListener('click', () => {
    document.getElementById('map-file-input').click();
  });
  document.getElementById('map-file-input').addEventListener('change', (e) => {
    Array.from(e.target.files||[]).forEach(importMapImageFile);
    e.target.value = ''; // allow re-importing the same filename later
  });

  // ============================================================ input controller
  const raycaster = new THREE.Raycaster();
  const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
  function ndcOf(x,y) { return new THREE.Vector2((x/window.innerWidth)*2-1, -(y/window.innerHeight)*2+1); }
  function raycastGround(x,y) {
    raycaster.setFromCamera(ndcOf(x,y), camera);
    const pt = new THREE.Vector3();
    return raycaster.ray.intersectPlane(groundPlane, pt) ? { x:pt.x, z:pt.z } : null;
  }
  function raycastObjects(x,y,objects) {
    raycaster.setFromCamera(ndcOf(x,y), camera);
    return raycaster.intersectObjects(objects, false);
  }

  let pointerDown = null;
  let isCameraDragging = false;
  let dragMode = 'orbit';
  let draggedNode = null; // {kind:'road'|'roadHandle'|'zone'|'zoneHandle', ...}
  let pendingInsert = null; // edge insertion candidate while shift is held
  let lastGroundClick = null; // {x,y,time} for double-click-to-finish detection
  let lastNodeClick = null; // {kind,nodeId|zoneId+index,time} for double-click-to-delete detection
  let rightClickTarget = null; // node/vertex hit under a right-click, for the context menu

  const dom = renderer.domElement;
  function pickNodeOrHandle(x,y) {
    const roadHandleHits = raycastObjects(x,y, roadHandleGroup.children.filter(c=>c.userData && c.userData.handleKind));
    if (roadHandleHits.length) return { kind:'roadHandle', nodeId: roadHandleHits[0].object.userData.nodeId, which: roadHandleHits[0].object.userData.handleKind };
    const zoneHandleMarkers = zones.flatMap(z => z.markerGroup ? z.markerGroup.children.filter(c=>c.userData && c.userData.handleKind) : []);
    const zoneHandleHits = raycastObjects(x,y, zoneHandleMarkers);
    if (zoneHandleHits.length) { const ud=zoneHandleHits[0].object.userData; return { kind:'zoneHandle', zoneId: ud.zoneId, index: ud.ownerIndex, which: ud.handleKind }; }
    const roadNodeHits = raycastObjects(x,y, roadMarkerGroup.children);
    if (roadNodeHits.length) return { kind:'road', nodeId: roadNodeHits[0].object.userData.nodeId };
    const zoneVertexMarkers = zones.flatMap(z => z.markerGroup ? z.markerGroup.children.filter(c=>c.userData.vertexIndex!==undefined) : []);
    const zoneVertexHits = raycastObjects(x,y, zoneVertexMarkers);
    if (zoneVertexHits.length) { const ud=zoneVertexHits[0].object.userData; return { kind:'zone', zoneId: ud.zoneId, index: ud.vertexIndex }; }
    return null;
  }
  dom.addEventListener('pointerdown', (e) => {
    if (interactionMode==='maps') {
      if (mapTransform) {
        if (e.button===2) cancelMapTransform();
        else if (e.button===0) confirmMapTransform();
        dom.setPointerCapture(e.pointerId);
        return;
      }
      if (e.button===0) {
        const hit = raycastObjects(e.clientX, e.clientY, mapImages.filter(m=>m.mesh.visible).map(m=>m.mesh.userData.plane));
        if (hit.length) {
          const found = mapImages.find(m=>m.mesh.userData.plane===hit[0].object);
          setSelectedMap(found ? found.id : null);
          pointerDown = { x:e.clientX, y:e.clientY, button:e.button, time:performance.now() };
          isCameraDragging = false;
          dom.setPointerCapture(e.pointerId);
          return;
        }
        setSelectedMap(null);
      }
      pointerDown = { x:e.clientX, y:e.clientY, button:e.button, time:performance.now() };
      draggedNode = null; rightClickTarget = null;
      isCameraDragging = true;
      dragMode = e.shiftKey ? 'pan' : 'orbit';
      dom.setPointerCapture(e.pointerId);
      return;
    }
    if (interactionMode==='node' && e.button===0 && e.shiftKey && (currentTool==='road' || currentTool==='zone' || currentTool==='train')) {
      let found = null;
      if (currentTool==='train') found = findNearestTrainEdge(e.clientX, e.clientY);
      else { const gp = raycastGround(e.clientX, e.clientY); if (gp) found = findNearestEdge(gp, 6); }
      if (found) { insertNodeOnEdge(found); dom.setPointerCapture(e.pointerId); return; }
    }
    if (interactionMode==='node' && e.button===0 && !e.shiftKey && lastGroundClick
        && (performance.now()-lastGroundClick.time)<350
        && Math.hypot(e.clientX-lastGroundClick.x, e.clientY-lastGroundClick.y)<10
        && (currentTool==='road' || currentTool==='zone' || currentTool==='train')) {
      lastGroundClick = null;
      finishActiveDrawing();
      dom.setPointerCapture(e.pointerId);
      return;
    }
    pointerDown = { x:e.clientX, y:e.clientY, button:e.button, time:performance.now() };
    draggedNode = null;
    rightClickTarget = null;
    isCameraDragging = false;
    if (e.button===1) {
      isCameraDragging = true;
      dragMode = e.shiftKey ? 'pan' : 'orbit';
    } else if (e.button===0) {
      if (interactionMode==='move') {
        isCameraDragging = true;
        dragMode = e.shiftKey ? 'pan' : 'orbit';
      } else {
        const picked = pickNodeOrHandle(e.clientX, e.clientY);
        if (picked) draggedNode = picked;
        else { isCameraDragging = true; dragMode = e.shiftKey ? 'pan' : 'orbit'; }
      }
    } else if (e.button===2 && interactionMode==='node') {
      const picked = pickNodeOrHandle(e.clientX, e.clientY);
      if (picked && (picked.kind==='road' || picked.kind==='zone')) rightClickTarget = picked;
    }
    dom.setPointerCapture(e.pointerId);
  });

  dom.addEventListener('pointermove', (e) => {
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    if (interactionMode==='maps') {
      if (mapTransform) { applyMapTransform(e.clientX, e.clientY, e.shiftKey); return; }
      if (isCameraDragging) {
        if (dragMode==='pan') controls.pan(e.movementX, e.movementY); else controls.orbit(e.movementX, e.movementY);
        return;
      }
      const hit = raycastObjects(e.clientX, e.clientY, mapImages.filter(m=>m.mesh.visible).map(m=>m.mesh.userData.plane));
      const found = hit.length ? mapImages.find(m=>m.mesh.userData.plane===hit[0].object) : null;
      setMapHover(found ? found.id : null);
      return;
    }
    if (isCameraDragging) {
      if (dragMode==='pan') controls.pan(e.movementX, e.movementY); else controls.orbit(e.movementX, e.movementY);
      return;
    }
    if (draggedNode) {
      if ((draggedNode.kind==='road' || draggedNode.kind==='roadHandle') && isTrainNode(draggedNode.nodeId)) { dragTrainPoint(e); return; }
      const gp = raycastGround(e.clientX, e.clientY);
      if (gp) {
        if (draggedNode.kind==='road') {
          const n = roadNodes[draggedNode.nodeId];
          const sp = snapPointToGrid(gp, 'road');
          const dx=sp.x-n.x, dz=sp.z-n.z;
          n.x=sp.x; n.z=sp.z;
          if (n.type==='spline') {
            if (n.handleIn) { n.handleIn.x+=dx; n.handleIn.z+=dz; }
            if (n.handleOut) { n.handleOut.x+=dx; n.handleOut.z+=dz; }
          }
          rebuildRoadMeshes();
        } else if (draggedNode.kind==='roadHandle') {
          const n = roadNodes[draggedNode.nodeId];
          n[draggedNode.which] = gp;
          rebuildRoadMeshes();
        } else if (draggedNode.kind==='zone') {
          const zone=zones.find(z=>z.id===draggedNode.zoneId);
          if (zone) {
            const p = zone.points[draggedNode.index];
            const sp = snapPointToGrid(gp, 'zone');
            const dx=sp.x-p.x, dz=sp.z-p.z;
            p.x=sp.x; p.z=sp.z;
            if (p.type==='spline') {
              if (p.handleIn) { p.handleIn.x+=dx; p.handleIn.z+=dz; }
              if (p.handleOut) { p.handleOut.x+=dx; p.handleOut.z+=dz; }
            }
            rebuildZoneVisual(zone);
          }
        } else if (draggedNode.kind==='zoneHandle') {
          const zone=zones.find(z=>z.id===draggedNode.zoneId);
          if (zone) {
            const p = zone.points[draggedNode.index];
            p[draggedNode.which] = gp;
            rebuildZoneVisual(zone);
          }
        }
      }
      return;
    }

    if (interactionMode==='move') {
      previewLine.visible = false;
      insertPreviewMarker.visible = false;
      setHover(null);
      return;
    }

    if (e.shiftKey && (currentTool==='road' || currentTool==='zone' || currentTool==='train')) {
      previewLine.visible = false;
      setHover(null);
      let found = null;
      if (currentTool==='train') found = findNearestTrainEdge(e.clientX, e.clientY);
      else { const gp = raycastGround(e.clientX, e.clientY); if (gp) found = findNearestEdge(gp, 6); }
      if (found) { updateInsertPreviewGeometry(found.point, found.angle); insertPreviewMarker.visible = true; pendingInsert = found; }
      else { insertPreviewMarker.visible = false; pendingInsert = null; }
      return;
    }
    insertPreviewMarker.visible = false;
    pendingInsert = null;

    const hoverList = roadMarkerGroup.children
      .concat(roadHandleGroup.children.filter(c=>c.userData && c.userData.handleKind))
      .concat(zones.flatMap(z => z.markerGroup ? z.markerGroup.children.filter(c=>c.userData.vertexIndex!==undefined || c.userData.handleKind) : []));
    const hoverHits = raycastObjects(e.clientX, e.clientY, hoverList);
    setHover(hoverHits.length ? hoverHits[0].object : null);

    if (currentTool==='train' && activeRoadLine) {
      // preview the next tube segment level with the last node, where the cursor meets that height
      const from = roadNodes[activeRoadLine.nodeIds[activeRoadLine.nodeIds.length-1]];
      const to = from ? snapPointToGrid(trainPlanePoint(e.clientX, e.clientY, trainNodeY(from)), 'road') : null;
      if (to) {
        setLinePoints(previewLine.geometry, [new THREE.Vector3(from.x,trainNodeY(from),from.z), new THREE.Vector3(to.x,trainNodeY(from),to.z)]);
        previewLine.visible = true;
      }
    } else if ((currentTool==='road' && activeRoadLine) || (currentTool==='zone' && activeZone)) {
      const gp = snapPointToGrid(raycastGround(e.clientX, e.clientY), currentTool);
      if (gp) {
        let from;
        if (currentTool==='road') { const lastId = activeRoadLine.nodeIds[activeRoadLine.nodeIds.length-1]; from = roadNodes[lastId]; }
        else { from = activeZone.points[activeZone.points.length-1]; }
        if (from) {
          setLinePoints(previewLine.geometry, [new THREE.Vector3(from.x,Y_PREVIEW,from.z), new THREE.Vector3(gp.x,Y_PREVIEW,gp.z)]);
          previewLine.visible = true;
        }
      }
    } else {
      previewLine.visible = false;
    }
  });

  dom.addEventListener('pointerup', (e) => {
    const was = pointerDown; pointerDown=null;
    const camDrag = isCameraDragging; isCameraDragging=false;
    const dn = draggedNode; draggedNode=null;
    if (!was) return;
    if (interactionMode==='maps') return; // selection/transform already handled on pointerdown/pointermove
    const dist = Math.hypot(e.clientX-was.x, e.clientY-was.y);
    const dt = performance.now()-was.time;

    if (camDrag) {
      if (was.button===0 && dist<6 && dt<600 && interactionMode==='node') {
        handleLeftClick(e.clientX, e.clientY);
        lastGroundClick = { x:e.clientX, y:e.clientY, time:performance.now() };
      }
      return;
    }

    if (dn) {
      if (dist<6 && dt<600) {
        if (dn.kind==='road') {
          if (activeRoadLine) {
            const ids = activeRoadLine.nodeIds;
            if (dn.nodeId !== ids[ids.length-1]) {
              ids.push(dn.nodeId);
              activeRoadLine.drawing = false;
              const kind = networkKindOf(activeRoadLine);
              const merged = mergeActiveRoadLineInto(dn.nodeId);
              activeRoadLine = null;
              if (merged) selectItem(kind, merged.networkId, true);
            }
            rebuildRoadMeshes(); zones.forEach(subdivideZone); renderHierarchy();
          } else if (lastNodeClick && lastNodeClick.kind==='road' && lastNodeClick.nodeId===dn.nodeId && (performance.now()-lastNodeClick.time)<350) {
            lastNodeClick = null;
            deleteRoadNode(dn.nodeId);
          } else {
            lastNodeClick = { kind:'road', nodeId: dn.nodeId, time: performance.now() };
            const line = roadLines.find(l => l.nodeIds.includes(dn.nodeId));
            if (line) selectItem(networkKindOf(line), line.networkId);
          }
        } else if (dn.kind==='zone') {
          const zone = zones.find(z=>z.id===dn.zoneId);
          if (zone) {
            if (activeZone && zone.id===activeZone.id && dn.index===0 && activeZone.points.length>=3) {
              closeActiveZone();
            } else if (!activeZone) {
              if (lastNodeClick && lastNodeClick.kind==='zone' && lastNodeClick.zoneId===dn.zoneId && lastNodeClick.index===dn.index && (performance.now()-lastNodeClick.time)<350) {
                lastNodeClick = null;
                deleteZoneVertex(zone, dn.index);
              } else {
                lastNodeClick = { kind:'zone', zoneId: dn.zoneId, index: dn.index, time: performance.now() };
                selectItem('zone', zone.id);
              }
            }
          }
        }
        // roadHandle / zoneHandle: a bare click on a handle does nothing
      } else {
        if (dn.kind==='road' || dn.kind==='roadHandle') {
          const line = roadLines.find(l => l.nodeIds.includes(dn.nodeId));
          rebuildRoadMeshes();
          if (!line || !isTrainLine(line)) zones.forEach(subdivideZone); // trains don't affect zones
          if (line) selectItem(networkKindOf(line), line.networkId, true); else renderHierarchy();
        } else if (dn.kind==='zone' || dn.kind==='zoneHandle') {
          const zone=zones.find(z=>z.id===dn.zoneId);

  function mergeActiveRoadLineInto(sharedNodeId) {
    const targetLine = roadLines.find(l => l.id !== activeRoadLine.id && l.nodeIds.includes(sharedNodeId));
    if (!targetLine) return null;
    const tIdx = targetLine.nodeIds.indexOf(sharedNodeId);
    const isEndpoint = (tIdx === 0 || tIdx === targetLine.nodeIds.length-1);
    if (!isEndpoint) {
      // mid-road branch: keep as a separate line (can't collapse a branch into one ordered path),
      // but join the same network so it's grouped and highlighted together.
      activeRoadLine.networkId = targetLine.networkId;
      return { branched: true, networkId: targetLine.networkId };
    }
    const activeIds = activeRoadLine.nodeIds; // already ends with sharedNodeId
    if (tIdx === targetLine.nodeIds.length-1) {
      targetLine.nodeIds = targetLine.nodeIds.concat(activeIds.slice(0,-1).reverse());
    } else {
      targetLine.nodeIds = activeIds.concat(targetLine.nodeIds.slice(1));
    }
    roadLines = roadLines.filter(l => l.id !== activeRoadLine.id);
    return targetLine;
  }
  function handleLeftClick(x,y) {
    let gp = raycastGround(x,y);
    if (!gp) return;
    if (currentTool==='road') {
      gp = snapPointToGrid(gp, 'road');
      const id = 'n'+(roadNodeSeq++);
      roadNodes[id] = { x:gp.x, z:gp.z, type:'poly', handleIn:null, handleOut:null };
      if (activeRoadLine) { activeRoadLine.nodeIds.push(id); }
      else {
        const templateLine = lastSelectedRoadNetworkId ? roadLines.find(l=>l.networkId===lastSelectedRoadNetworkId) : null;
        const width = templateLine ? templateLine.width : DEFAULT_ROAD_WIDTH;
        const color = templateLine ? templateLine.color : ROAD_COLOR;
        const sidewalkWidth = templateLine && templateLine.sidewalkWidth!=null ? templateLine.sidewalkWidth : DEFAULT_SIDEWALK_WIDTH;
        const sidewalkColor = templateLine && templateLine.sidewalkColor!=null ? templateLine.sidewalkColor : SIDEWALK_COLOR;
        const roadType = templateLine && templateLine.roadType ? templateLine.roadType : 'sidewalk';
        const pathColor = templateLine && templateLine.pathColor!=null ? templateLine.pathColor : PATH_COLOR;
        const line={ id:'road-'+(roadLineSeq++), nodeIds:[id], drawing:true, width, color, sidewalkWidth, sidewalkColor, roadType, pathColor, networkId:'net-'+(roadNetworkSeq++) };
        roadLines.push(line); activeRoadLine=line;
      }
      rebuildRoadMeshes(); zones.forEach(subdivideZone); renderHierarchy();
    } else if (currentTool==='train') {
      // a new node goes where the cursor meets the height of the line so far (or the default height, for a new line)
      const last = activeRoadLine ? roadNodes[activeRoadLine.nodeIds[activeRoadLine.nodeIds.length-1]] : null;
      const height = last ? trainNodeY(last) : TRAIN_DEFAULT_HEIGHT;
      const pt = snapPointToGrid(trainPlanePoint(x, y, height), 'road');
      if (!pt) return;
      const id = 'n'+(roadNodeSeq++);
      roadNodes[id] = { x:pt.x, y:height, z:pt.z, type:'poly', handleIn:null, handleOut:null };
      if (activeRoadLine) { activeRoadLine.nodeIds.push(id); }
      else {
        const templateLine = lastSelectedTrainNetworkId ? roadLines.find(l=>l.networkId===lastSelectedTrainNetworkId) : null;
        const radius = templateLine && templateLine.radius ? templateLine.radius : TRAIN_DEFAULT_RADIUS;
        const line = { id:'train-'+(roadLineSeq++), kind:'train', nodeIds:[id], drawing:true, radius, networkId:'rail-'+(roadNetworkSeq++) };
        roadLines.push(line); activeRoadLine=line;
      }
      rebuildRoadMeshes(); renderHierarchy();
    } else if (currentTool==='zone') {
      gp = snapPointToGrid(gp, 'zone');
      const point = { x:gp.x, z:gp.z, type:'poly', handleIn:null, handleOut:null };
      if (activeZone) { activeZone.points.push(point); rebuildZoneVisual(activeZone); }
      else {
        const templateZone = lastSelectedZoneId ? zones.find(z=>z.id===lastSelectedZoneId) : null;
        const zoneType = templateZone ? templateZone.zoneType : 'buildings';
        const baseSettings = templateZone ? templateZone.settings : DEFAULT_ZONE_SETTINGS;
        const zone = { id:'zone-'+(zoneSeq++), name:'Zone '+zoneSeq, points:[point], closed:false, drawing:true, zoneType,
          settings:{ ...baseSettings, seed:Math.floor(Math.random()*100000) } };
        zones.unshift(zone); activeZone=zone; rebuildZoneVisual(zone); // new zones start at the top, cutting into whatever they're drawn over
      }
      renderHierarchy();
    }
  }

  function setNodeType(target, type) {

  // ============================================================ project save / load
  const PROJECT_FORMAT_VERSION = 1;
  function colorToHex(n, fallback) {
    const v = (n!=null ? n : fallback) >>> 0;
    return '#'+v.toString(16).padStart(6,'0');
  }
  function hexToColor(s, fallback) {
    if (typeof s !== 'string') return fallback;
    const n = parseInt(s.replace('#',''),16);
    return Number.isFinite(n) ? n : fallback;
  }
  function serializePoint(p) {
    const withY = (out, src) => src.y!=null ? { ...out, y:src.y } : out; // only train nodes and handles have a height
    return withY({ x:p.x, z:p.z, type:p.type||'poly',
      handleIn: p.handleIn ? withY({x:p.handleIn.x, z:p.handleIn.z}, p.handleIn) : null,
      handleOut: p.handleOut ? withY({x:p.handleOut.x, z:p.handleOut.z}, p.handleOut) : null }, p);
  }
  function serializeProject() {
    const finishedLines = roadLines.filter(l => !l.drawing);
    const usedNodeIds = new Set();
    finishedLines.forEach(l => l.nodeIds.forEach(id => usedNodeIds.add(id)));
    const nodes = {};
    usedNodeIds.forEach(id => { if (roadNodes[id]) nodes[id] = serializePoint(roadNodes[id]); });
    return {
      version: PROJECT_FORMAT_VERSION,
      app: 'blockout',
      exportedAt: new Date().toISOString(),
      scene: {
        groundColor: colorToHex(groundMat.color.getHex()),
        gridColor: document.getElementById('s-gridcolor').value,
        sunElevation, sunAzimuth,
        defaultRoadWidth: DEFAULT_ROAD_WIDTH,
        defaultSidewalkWidth: DEFAULT_SIDEWALK_WIDTH,
        defaultTrainHeight: TRAIN_DEFAULT_HEIGHT,
        defaultTrainRadius: TRAIN_DEFAULT_RADIUS,
        trainCoilTurnsPer10: TRAIN_COIL_TURNS_PER_10,
        groundColorPalette: BUILDING_GROUND_COLORS.map(c => colorToHex(c)),
        roadColorPalette: ROAD_COLOR_PALETTE.map(c => colorToHex(c)),
        sidewalkColorPalette: SIDEWALK_COLOR_PALETTE.map(c => colorToHex(c)),
        pathColorPalette: PATH_COLOR_PALETTE.map(c => colorToHex(c)),
        parkTintPalette: PARK_TINT_COLORS.map(c => colorToHex(c)),
        treeTintPalette: TREE_TINT_COLORS.map(c => colorToHex(c)),
        globalParkTint: colorToHex(globalParkTint, PARK_TINT_COLORS[0]),
        globalTreeTint: colorToHex(globalTreeTint, TREE_TINT_COLORS[0]),
        globalGrassNoiseStrength
      },
      roads: {
        nodeSeq: roadNodeSeq, lineSeq: roadLineSeq, networkSeq: roadNetworkSeq,
        nodes,
        lines: finishedLines.map(l => ({ id:l.id, nodeIds:l.nodeIds.slice(), width:l.width,
          color: colorToHex(l.color, ROAD_COLOR), sidewalkWidth:l.sidewalkWidth,
          sidewalkColor: colorToHex(l.sidewalkColor, SIDEWALK_COLOR), networkId:l.networkId,
          ...(isTrainLine(l) ? { kind:'train', radius:l.radius } : {}), ...(isPathLine(l) ? { roadType:'path', pathColor: colorToHex(l.pathColor, PATH_COLOR) } : {}), ...(isRiverLine(l) ? { roadType:'river' } : {}) }))
      },
      zoneSeq,
      zones: zones.filter(z => !z.drawing && z.points.length>=3).map(z => ({
        id:z.id, name:z.name, closed:!!z.closed, zoneType: z.zoneType||'buildings',
        points: z.points.map(serializePoint),
        settings: { ...z.settings, groundColor: colorToHex(z.settings.groundColor, BUILDING_GROUND_COLORS[0]) }
      })),
      mapImageSeq,
      mapImages: mapImages.map(m => ({
        id:m.id, name:m.name, dataUrl:m.dataUrl,
        position:{ x:m.mesh.position.x, z:m.mesh.position.z },
        rotationY:m.mesh.rotation.y, scale:m.mesh.scale.x, visible:m.mesh.visible
      }))

  // Saves a file to the viewer. Uses the Artifact "downloads" capability when
  // running as a published Claude artifact (window.claude.use exists); falls
  // back to a plain <a download> for local/self-hosted use.
  async function downloadFile(filename, blob) {
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        const downloads = await window.claude.use('downloads');
        if (downloads) {
          await downloads.save({ filename, data: blob });
          return;
        }
      } catch (err) {
        if (err && err.code === 'declined') return;
        console.warn('downloads capability failed, falling back to <a download>', err);
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

    const data = serializeProject();

  async function restoreMapImages(list) {

        const file = new File([blob], im.name||'image', { type: blob.type||'image/png' });
        await new Promise(resolve => {
          importMapImageFile(file, {
            id: im.id, name: im.name, position: im.position, rotationY: im.rotationY,
            scale: im.scale, visible: im.visible, skipSelect: true, onDone: resolve
          });
        });
      } catch (err) { console.error('Blockout: failed to restore map image', im && im.name, err); }
    }
  }

  // ============================================================ OBJ export
  function exportOBJ() {
    const meshes = [];
    roadMeshGroup.traverse(o => { if (o.isMesh) meshes.push(o); });
    trainMeshGroup.traverse(o => { if (o.isMesh && !o.userData.isShuttle) meshes.push(o); }); // moving shuttles aren't part of the city
    zones.forEach(z => { if (z.buildingsGroup) z.buildingsGroup.traverse(o => { if (o.isMesh) meshes.push(o); }); });
    [waterGroup, bridgeGroup].forEach(group => group.traverse(o => { if (o.isMesh && !o.userData.noExport) meshes.push(o); }));
    if (!meshes.length) { alert('Nothing to export yet — draw some roads or zones first.'); return; }
    let out = '# Blockout export\n';
    let offset = 1, n = 0;
    meshes.forEach(obj => {
      obj.updateMatrixWorld(true);
      const geo = obj.geometry, pos = geo.attributes.position, matrix = obj.matrixWorld;
      out += `o ${obj.name||'Object'}_${n++}\n`;
      const v = new THREE.Vector3();
      for (let i=0;i<pos.count;i++) { v.fromBufferAttribute(pos,i).applyMatrix4(matrix); out += `v ${v.x.toFixed(4)} ${v.y.toFixed(4)} ${v.z.toFixed(4)}\n`; }
      if (geo.index) {
        const idx = geo.index;
        for (let i=0;i<idx.count;i+=3) { out += `f ${idx.getX(i)+offset} ${idx.getX(i+1)+offset} ${idx.getX(i+2)+offset}\n`; }
      } else {
        for (let i=0;i<pos.count;i+=3) { out += `f ${i+offset} ${i+1+offset} ${i+2+offset}\n`; }
      }
      offset += pos.count;
    });
    const blob = new Blob([out], { type:'text/plain' });
    downloadFile('blockout_city.obj', blob);

  // as the last material using it is disposed — so a rebuild that replaces every material of one kind (every water tile,
  // every road surface…) would compile that shader again from scratch: a hitch of up to a third of a second. One
  // never-disposed mesh per kind of material (a single zero-size triangle, so it draws nothing) keeps each program alive.
  const shaderKeepAlive = new THREE.Group();
  shaderKeepAlive.name = 'ShaderKeepAlive';
  const standardWith = (applyShader, params) => () => {
    const mat = new THREE.MeshStandardMaterial({ roughness: 1, ...(params || {}) });
    if (applyShader) applyShader(mat);
    return mat;
  };
  [
    standardWith(mat => applyWaterShader(mat, [], [], 0)),
    standardWith(mat => applyGrassNoiseShader(mat, [{ x:0, z:0 }, { x:1, z:0 }, { x:0, z:1 }], 1, [])),
    standardWith(mat => applyCropShader(mat, 1, 0, 1, 0.2)),
    standardWith(mat => applyPavingShader(mat, 0)),
    standardWith(mat => applyPathShader(mat, [], 1, 1), { transparent: true, depthWrite: false, ...SKIP_OVER_WATER }),
    standardWith(null, { side: THREE.DoubleSide }),                                         // road surfaces, fountain stone
    standardWith(null, { vertexColors: true, flatShading: true, side: THREE.DoubleSide }),  // building bodies
    standardWith(null, { flatShading: true }),                                              // building details (greebles, ribs, canopies…)
    standardWith(null, { flatShading: true, side: THREE.DoubleSide }),                      // landmark cone toppers
    standardWith(null, { transparent: true, opacity: 0.5, depthWrite: false }),             // glass domes, fountain spray
    () => createWindowMaterial(0x888888, mulberry32(1), true, 1, 1, true),                  // building windows, with and
    () => createWindowMaterial(0x888888, mulberry32(1), true, 1, 1, false),                 // without reflections
    () => new THREE.MeshBasicMaterial({ color: 0xffffff }),
  ].forEach(makeMaterial => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([0,-10,0, 0,-10,0, 0,-10,0], 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute([0,1,0, 0,1,0, 0,1,0], 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute([1,1,1, 1,1,1, 1,1,1], 3));
    const mesh = new THREE.Mesh(geo, makeMaterial());
    mesh.frustumCulled = false;
    shaderKeepAlive.add(mesh);
  });
  scene.add(shaderKeepAlive);
  function animate() {
    requestAnimationFrame(animate);
    controls.update(false);
    skyDome.position.copy(camera.position);
    const t = performance.now()*0.001;
    updateTrainShuttles(t);
    if (waterDirty) rebuildWater();
    WATER_TIME.value = t;
    scene.traverse(o => {
      if (o.userData && o.userData.isBlinkLight) {
        o.material.emissiveIntensity = 0.5 + Math.sin(t*3 + o.userData.blinkPhase)*0.5;
      }
    });
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
