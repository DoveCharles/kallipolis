<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockout — procedural city generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  :root{
    --bg-viewport: #12141a;
    --bg-panel: #1a1c22;
    --bg-input: #101216;
    --border: #2b2e36;
    --text: #e7e8ea;
    --text-dim: #9296a0;
    --accent: #3ddc97;
    --accent-dim: #2a8f65;
    --warn: #ffd23d;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; } /* forces native form UI (the color picker popup included) to render dark regardless of the OS theme */
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg-viewport); font-family:var(--sans); }
  #canvas-wrap { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }

  #panel {
    position:fixed; top:16px; left:16px; width:266px;
    background:var(--bg-panel); border:1px solid var(--border); border-radius:8px;
    padding:16px; color:var(--text); user-select:none;
    max-height:calc(100vh - 32px); overflow-y:auto;
  }
  #panel h1 { font-size:16px; font-weight:600; margin:0; letter-spacing:0.01em; }
  #panel .subtitle { font-size:11px; color:var(--text-dim); margin:2px 0 14px 0; font-family:var(--mono); }

  .toolbar { display:flex; gap:4px; background:var(--bg-input); border:1px solid var(--border); border-radius:6px; padding:3px; margin-bottom:8px; }
  .tool-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:7px 0; border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; border-radius:4px; cursor:pointer; font-family:var(--sans); }
  .tool-btn.active { background:var(--accent); color:#0b1a12; }
  .tool-btn:not(.active):hover { color:var(--text); }

  #tool-hint { font-size:11px; color:var(--text-dim); line-height:1.5; margin-bottom:14px; font-family:var(--mono); }

  .section { margin-bottom:14px; }
  .section-label { font-size:11px; color:var(--text-dim); margin-bottom:6px; font-weight:600; display:flex; justify-content:space-between; }

  .hier-list { max-height:130px; overflow-y:auto; border:1px solid var(--border); border-radius:6px; margin-bottom:4px; }
  .hier-list:empty::after { content:'none yet'; display:block; padding:8px 10px; font-size:11px; color:var(--text-dim); font-family:var(--mono); }
  .hier-row { display:flex; align-items:center; justify-content:space-between; padding:7px 10px; font-size:12px; cursor:pointer; border-bottom:1px solid var(--border); }
  .hier-row:last-child { border-bottom:none; }
  .hier-row:hover { background:rgba(255,255,255,0.03); }
  .hier-row.active { background:rgba(61,220,151,0.12); color:var(--accent); }
  .hier-row.dragging { opacity:0.4; }
  .hier-row.drop-before { box-shadow:inset 0 2px 0 var(--accent); }
  .hier-row.drop-after { box-shadow:inset 0 -2px 0 var(--accent); }
  .hier-del { background:none; border:none; color:var(--text-dim); font-size:14px; cursor:pointer; line-height:1; padding:0 2px; }
  .hier-del:hover { color:#e0665c; }
  .hier-eye { background:none; border:none; color:var(--text-dim); cursor:pointer; line-height:1; padding:0 4px; display:flex; align-items:center; flex-shrink:0; }
  .hier-eye:hover { color:var(--accent); }
  .hier-eye.off { color:var(--border); }

  .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .row label { font-size:12px; color:var(--text); flex:1; }
  .row .val { font-family:var(--mono); font-size:11px; color:var(--accent); min-width:34px; text-align:right; }
  input[type=range] {
    -webkit-appearance:none; width:100%; height:3px; border-radius:2px;
    background:var(--border); outline:none; margin:0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:var(--accent); cursor:pointer; border:none;
  }
  input[type=range]::-moz-range-thumb {
    width:12px; height:12px; border-radius:50%; background:var(--accent); border:none; cursor:pointer;
  }
  .slider-row { margin-bottom:11px; }
  .slider-row .row { margin-bottom:4px; }

  /* dual-handle range slider: two overlapping <input type=range>, each transparent everywhere
     except its own thumb (pointer-events:none on the input, :auto on the thumb pseudo-element)
     so clicks always reach whichever handle is actually under the cursor. */
  .range-slider { position:relative; height:16px; }
  .range-slider .range-track {
    position:absolute; top:50%; left:0; right:0; height:3px; margin-top:-1.5px;
    background:var(--border); border-radius:2px;
  }
  .range-slider .range-fill {
    position:absolute; top:50%; height:3px; margin-top:-1.5px;
    background:var(--accent); border-radius:2px;
  }
  .range-slider input[type=range] {
    position:absolute; top:0; left:0; width:100%; height:16px; margin:0;
    background:transparent; pointer-events:none;
  }
  .range-slider input[type=range]::-webkit-slider-runnable-track { background:transparent; }
  .range-slider input[type=range]::-webkit-slider-thumb { pointer-events:auto; }
  .range-slider input[type=range]::-moz-range-track { background:transparent; border:none; }
  .range-slider input[type=range]::-moz-range-thumb { pointer-events:auto; }

  .seed-row { display:flex; gap:6px; margin-bottom:4px; }
  .seed-row input[type=number] {
    flex:1; background:var(--bg-input); border:1px solid var(--border); color:var(--text);
    font-family:var(--mono); font-size:12px; padding:6px 8px; border-radius:5px; outline:none; width:0;
  }
  .icon-btn {
    background:var(--bg-input); border:1px solid var(--border); color:var(--text-dim);
    width:30px; border-radius:5px; cursor:pointer; font-size:14px;
  }
  .icon-btn:hover { color:var(--accent); border-color:var(--accent-dim); }

  .btn {
    width:100%; padding:9px; border-radius:5px; border:1px solid var(--border);
    background:var(--bg-input); color:var(--text); font-size:12px; font-weight:600;
    cursor:pointer; margin-top:6px; font-family:var(--sans);
  }
  .btn:hover { border-color:var(--accent-dim); }
  .btn.danger:hover { border-color:#e0665c; color:#e0665c; }

  #details-panel { border-top:1px solid var(--border); padding-top:12px; margin-top:2px; }
  #details-panel .empty { font-size:11px; color:var(--text-dim); font-family:var(--mono); }
  #details-panel .title-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  #details-panel .title-row .name { font-size:12px; font-weight:600; }
  #details-panel .close-x { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:13px; }

  #hint {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    background:rgba(26,28,34,0.7); padding:6px 12px; border-radius:5px;
    border:1px solid var(--border); pointer-events:none; white-space:nowrap; max-width:90vw; text-align:center;
  }

  #stats {
    position:fixed; top:16px; right:16px; font-family:var(--mono); font-size:11px;
    color:var(--text-dim); background:var(--bg-panel); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; text-align:right; line-height:1.6;
  }
  #stats span { color:var(--accent); }
  #rw-context { color:var(--text-dim); }

  .select-input {
    width:100%; background:var(--bg-input); border:1px solid var(--border); color:var(--text);
    font-family:var(--sans); font-size:12px; padding:7px 8px; border-radius:5px; outline:none; margin-bottom:2px;
  }
  .swatch-row { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .swatch-wrap { position:relative; width:26px; height:26px; flex-shrink:0; }
  .swatch {
    width:26px; height:26px; border-radius:5px; border:2px solid var(--border); cursor:pointer; padding:0;
  }
  .swatch.active { border-color:var(--accent); }
  .swatch:hover { border-color:var(--accent-dim); }
  .swatch-delete {
    display:none; position:absolute; top:-6px; right:-6px; width:15px; height:15px; border-radius:50%;
    background:#e0665c; color:#fff; border:2px solid var(--bg-panel); cursor:pointer; padding:0;
    font-size:10px; line-height:1; font-family:var(--sans); align-items:center; justify-content:center;
  }
  .swatch-wrap:hover .swatch-delete { display:flex; }
  .swatch-delete:hover { background:#ff7a6e; }
  .swatch-add {
    background:var(--bg-input); display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:15px; font-weight:600; line-height:1; border-style:dashed;
  }
  .swatch-add:hover { color:var(--accent); border-color:var(--accent-dim); }
  .add-color-row { display:flex; align-items:center; gap:6px; }
  .add-color-confirm {
    background:var(--accent); color:#0b1a12; border:none; border-radius:5px; cursor:pointer;
    font-size:12px; font-weight:600; font-family:var(--sans); padding:0 12px; height:26px;
  }
  .add-color-confirm:hover { background:#33c488; }
  .add-color-cancel {
    background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:15px;
    line-height:1; padding:0 4px; height:26px;
  }
  .add-color-cancel:hover { color:#e0665c; }
  .toggle-switch { width:38px; height:20px; border-radius:10px; background:var(--bg-input); border:1px solid var(--border); position:relative; cursor:pointer; padding:0; flex-shrink:0; }
  .toggle-switch .knob { position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--text-dim); transition:left 0.15s, background 0.15s; }
  .toggle-switch.on { background:rgba(61,220,151,0.25); border-color:var(--accent); }
  .toggle-switch.on .knob { left:20px; background:var(--accent); }
  input[type=color].color-input {
    -webkit-appearance:none; appearance:none; width:30px; height:26px; padding:0;
    border:2px solid var(--border); border-radius:5px; background:none; cursor:pointer; flex-shrink:0;
  }
  input[type=color].color-input:hover { border-color:var(--accent-dim); }
  input[type=color].color-input::-webkit-color-swatch-wrapper { padding:2px; }
  input[type=color].color-input::-webkit-color-swatch { border:none; border-radius:3px; }
  input[type=color].color-input::-moz-color-swatch { border:none; border-radius:3px; }

  #node-context-menu {
    position:fixed; display:none; z-index:50;
    background:var(--bg-panel); border:1px solid var(--border); border-radius:6px;
    padding:4px; box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  #node-context-menu button {
    display:block; width:100%; text-align:left; padding:6px 16px 6px 12px; background:none; border:none;
    color:var(--text); font-size:12px; font-family:var(--sans); cursor:pointer; border-radius:4px; white-space:nowrap;
  }
  #node-context-menu button:hover { background:rgba(255,255,255,0.06); }
  #node-context-menu button.active { color:var(--accent); font-weight:600; }

  #grid-toggle {
    position:fixed; top:16px; left:292px; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-panel); border:1px solid var(--border); border-radius:8px;
    color:var(--text-dim); cursor:pointer; user-select:none;
  }
  #grid-toggle:hover { color:var(--text); border-color:var(--accent-dim); }
  #grid-toggle.active { background:var(--accent); color:#0b1a12; border-color:var(--accent); }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="panel">
  <div class="toolbar" id="mode-toolbar" style="margin-top:0;">
    <button class="tool-btn" data-mode="move"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1"><circle cx="8" cy="8" r="6.3"/><ellipse cx="8" cy="8" rx="2.6" ry="6.3"/><path d="M1.8 5.7 L14.2 5.7 M1.8 10.3 L14.2 10.3"/></svg>World</button>
    <button class="tool-btn active" data-mode="node"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 12.5 L8 2.5 L13 12.5 Z"/><circle cx="3" cy="12.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="8" cy="2.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="13" cy="12.5" r="1.6" fill="currentColor" stroke="none"/></svg>Edit</button>
    <button class="tool-btn" data-mode="maps"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="2.5" width="13" height="11" rx="1.2"/><circle cx="5.2" cy="6" r="1.2" fill="currentColor" stroke="none"/><path d="M2 12.2 L6.3 8 L8.8 10.3 L11.3 7.3 L14 10.5"/></svg>Maps</button>
  </div>
  <div class="toolbar" id="entity-toolbar" style="margin-top:6px;">
    <button class="tool-btn active" data-entity="road">Road</button>
    <button class="tool-btn" data-entity="zone">Zone</button>
    <button class="tool-btn" data-entity="train">Train</button>
  </div>

  <div class="section" id="section-road">
    <div class="section-label">Roads <span id="roads-count">0</span></div>
    <div class="hier-list" id="roads-list"></div>
    <div class="slider-row" style="margin-top:8px;">
      <div class="row"><label>Road width <span id="rw-context" style="font-weight:400;"></span></label><span class="val" id="v-roadwidth">8</span></div>
      <input type="range" id="s-roadwidth" min="3" max="40" step="0.5" value="8">
    </div>
    <div class="slider-row">
      <div class="row"><label>Sidewalk size <span id="sw-context" style="font-weight:400;"></span></label><span class="val" id="v-sidewalkwidth">3</span></div>
      <input type="range" id="s-sidewalkwidth" min="0" max="10" step="0.5" value="3">
    </div>
  </div>

  <div class="section" id="section-zone" style="display:none;">
    <div class="section-label">Zones <span id="zones-count">0</span></div>
    <div class="hier-list" id="zones-list"></div>
    <div style="font-size:11px; color:var(--text-dim); margin-top:2px;">Drag to reorder — a zone cuts into the zones below it.</div>
  </div>

  <div class="section" id="section-train" style="display:none;">
    <div class="section-label">Train lines <span id="trains-count">0</span></div>
    <div class="hier-list" id="trains-list"></div>
    <div class="slider-row" style="margin-top:8px;">
      <div class="row"><label>Tube radius <span id="tr-context" style="font-weight:400;"></span></label><span class="val" id="v-tuberadius">2.5</span></div>
      <input type="range" id="s-tuberadius" min="1" max="6" step="0.25" value="2.5">
    </div>
    <div class="slider-row">
      <div class="row"><label>Height <span style="font-weight:400;">· new lines</span></label><span class="val" id="v-trainheight">14</span></div>
      <input type="range" id="s-trainheight" min="1" max="80" step="1" value="14">
    </div>
    <div class="slider-row">
      <div class="row"><label>Coil frequency <span style="font-weight:400;">· turns per 10</span></label><span class="val" id="v-coilfreq">1.00</span></div>
      <input type="range" id="s-coilfreq" min="0.1" max="5" step="0.05" value="1">
    </div>
  </div>

  <div class="section" id="section-maps" style="display:none;">
    <div class="section-label">Images <span id="maps-count">0</span></div>
    <div class="hier-list" id="maps-list"></div>
    <button class="btn" id="btn-import-image" style="margin-top:8px;">Import image</button>
    <input type="file" id="map-file-input" accept="image/png,image/jpeg" style="display:none;">
  </div>

  <div id="details-panel"><div class="empty">Select a road or zone from the list to see its settings.</div></div>

  <div class="section" id="section-move" style="display:none;">
    <div class="slider-row"><div class="row"><label>Sun elevation</label><span class="val" id="dv-sunelev">45</span></div>
      <input type="range" id="s-sunelev" min="-20" max="90" step="1" value="45"></div>
    <div class="slider-row"><div class="row"><label>Sun azimuth</label><span class="val" id="dv-sunazim">45</span></div>
      <input type="range" id="s-sunazim" min="0" max="360" step="1" value="45"></div>
    <div class="row"><label>Ground color</label><input type="color" class="color-input" id="s-groundcolor" value="#1b1e24"></div>
    <div class="row"><label>Grid color</label><input type="color" class="color-input" id="s-gridcolor" value="#33373f"></div>
    <div id="world-tint-panel"></div>
    <div class="slider-row"><div class="row"><label>Grass noise strength</label><span class="val" id="dv-grassnoise">0.20</span></div>
      <input type="range" id="s-grassnoise" min="0" max="2.5" step="0.05" value="0.2"></div>
    <button class="btn" id="btn-save-project" style="margin-top:11px;">Save project</button>
    <button class="btn" id="btn-load-project">Load project</button>
    <input type="file" id="project-file-input" accept=".json,application/json" style="display:none;">
    <button class="btn" id="btn-export">Export OBJ</button>
    <button class="btn danger" id="btn-clear">Clear all</button>
  </div>
</div>

<div id="grid-toggle" title="Snap to grid">

	H20.711c-5.557,0-10.062,4.505-10.062,10.062v149.087C10.649,235.16,72.489,297,148.5,297s137.851-61.84,137.851-137.851V10.062

	h43.77V159.149z M266.227,63.894h-43.77v-43.77h43.77V63.894z"/></svg>
</div>

<div id="stats">zones <span id="stat-zones">0</span> · roads <span id="stat-roads">0</span><br>buildings <span id="stat-buildings">0</span></div>

<div id="hint"></div>

<div id="node-context-menu"></div>

<script>
(function(){
  // ============================================================ renderer / scene
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  const bgColor = 0x12141a;
  scene.background = null;
  scene.fog = new THREE.Fog(bgColor, 600, 2800);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.5, 3000);
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  wrap.appendChild(renderer.domElement);
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const hemi = new THREE.HemisphereLight(0x8fa3b3, 0x23262c, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2df, 1.1);
  sun.position.set(150, 220, 100);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -300; sun.shadow.camera.right = 300;
  sun.shadow.camera.top = 300; sun.shadow.camera.bottom = -300;
  sun.shadow.camera.far = 800;
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // ---- procedural sky dome, driven by sun elevation/azimuth ----
  const skyDomeMat = new THREE.ShaderMaterial({
    uniforms: {
      sunDirection: { value: new THREE.Vector3(0,1,0) },
      topColor: { value: new THREE.Color(0x2f7fd0) },
      horizonColor: { value: new THREE.Color(0xdfefff) },
      sunColor: { value: new THREE.Color(0xffffff) },
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 sunDirection;
      uniform vec3 topColor;
      uniform vec3 horizonColor;
      uniform vec3 sunColor;
      void main() {
        vec3 dir = normalize(vDir);
        float h = clamp(dir.y, -1.0, 1.0);
        vec3 col;
        if (h > 0.0) {
          col = mix(horizonColor, topColor, pow(h, 0.55));
        } else {
          col = mix(horizonColor, horizonColor*0.35, pow(-h, 0.4));
        }
        float sunAmount = max(dot(dir, normalize(sunDirection)), 0.0);
        col += sunColor * pow(sunAmount, 380.0) * 2.0;
        col += sunColor * pow(sunAmount, 24.0) * 0.25;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
    side: THREE.BackSide,
    depthWrite: false,
    depthTest: false,
  });

    roadLines.forEach(line => {

  // ---------------------------------------------------------- trains

  // move in 3D, the line always curves smoothly through them (there's no poly/spline — a node is either plain track

  let TRAIN_DEFAULT_RADIUS = 2.5;

  const TRAIN_MIN_HEIGHT = 0.5;

  function isTrainLine(line) { return line.kind==='train'; }

  // A train line's centerline as 3D points — always the smoothest curve through its nodes, never a corner: a cubic
  // Hermite spline whose direction at each node follows the line from the node before to the node after, scaled by
  // the distances between them (chord-length Catmull-Rom), so unevenly spaced nodes don't make it bulge or overshoot.
  // At a station the direction is kept level, so the track runs flat through the station. `segments[k]` is the index
  // of the node-to-node stretch points[k] lies on.
  function trainCurve(nodeIds) {
    const nodes = nodeIds.map(id => roadNodes[id]).filter(Boolean);
    const P = nodes.map(n => new THREE.Vector3(n.x, trainNodeY(n), n.z));
    const count = P.length;
    if (count < 2) return { points: P, segments: P.map(() => 0) };
    const chord = [];
    for (let i=0;i<count-1;i++) chord.push(Math.max(1e-6, P[i].distanceTo(P[i+1])));
    const directions = P.map((p, i) => {
      const d = i===0 ? P[1].clone().sub(P[0]).divideScalar(chord[0])
        : i===count-1 ? P[i].clone().sub(P[i-1]).divideScalar(chord[i-1])
        : P[i+1].clone().sub(P[i-1]).divideScalar(chord[i-1] + chord[i]);
      if (nodes[i].type==='station') {
        const len = d.length();
        d.y = 0;
        if (d.lengthSq() > 1e-8) d.setLength(len);
      }
      return d;
    });
    const points = [P[0].clone()], segments = [0];
    for (let i=0;i<count-1;i++) {
      const steps = Math.max(6, Math.ceil(chord[i]/2)); // a point every couple of units, so the tube stays round on curves
      const m0 = directions[i].clone().multiplyScalar(chord[i]), m1 = directions[i+1].clone().multiplyScalar(chord[i]);
      for (let s=1;s<=steps;s++) {
        const t = s/steps, t2 = t*t, t3 = t2*t;

          .addScaledVector(P[i], 2*t3 - 3*t2 + 1).addScaledVector(m0, t3 - 2*t2 + t)

    points.forEach((p, k) => {

      outPoints.push(p); outSegments.push(segments[k]);

  // Arc-length lookups along a path: the point and heading a given distance from its start, and how far along the
  // path the point nearest some position is.
  function createPathSampler(path) {
    const cum = [0];
    for (let i=1;i<path.length;i++) cum.push(cum[i-1] + path[i].distanceTo(path[i-1]));
    const total = cum[cum.length-1];
    return {
      total,
      at(d) {
        d = Math.max(0, Math.min(total, d));
        let lo = 1, hi = path.length-1;
        while (lo < hi) { const mid = (lo+hi)>>1; if (cum[mid] < d) lo = mid+1; else hi = mid; }

  // The glass tube: a ring of vertices around every path point, carried along without twisting, and stretched across

  function buildTubeGeometry(path, radius) {
    const n = path.length, sides = TRAIN_TUBE_SIDES;
    const dirs = [];
    for (let i=0;i<n-1;i++) dirs.push(path[i+1].clone().sub(path[i]).normalize());
    const positions = [], normals = [], uvs = [], indices = [];
    let normal = null;
    for (let i=0;i<n;i++) {
      const dIn = dirs[Math.max(0, i-1)], dOut = dirs[Math.min(n-2, i)];
      const t = dIn.clone().add(dOut);
      if (t.lengthSq() < 1e-8) t.copy(dOut);
      t.normalize();
      if (!normal) normal = Math.abs(t.y) < 0.9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
      normal.addScaledVector(t, -normal.dot(t));

        normal.set(0,0,1).addScaledVector(t, -t.z);

    for (let i=0;i<n-1;i++) {
      for (let s=0;s<sides;s++) {

    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);

  }
  // The solenoid coil: one continuous flat ribbon spiralling around the tube, `turnsPer10` full turns per 10 world units
  // of track. It's wound on a frame carried along the track without twisting (as the tube is), so the spiral keeps an
  // even pitch through curves, and the ribbon's width always lies across its own direction of travel on the tube's
  // surface — so it stays a flat ribbon whether it's wound tight (running round the tube) or loose (running along it).
  // Stretches where `skip(distance)` is true (inside stations) are left out. Returns two geometries: `outer`, the

  function buildCoilGeometries(sampler, radius, turnsPer10, skip) {

    const turnsPerUnit = turnsPer10/10;

    const lean = 2*Math.PI*turnsPerUnit*coilRadius; // how far round the tube the coil moves per unit along it

      // carry the frame along even through skipped stretches, so the spiral picks up where it left off
      if (!normal) normal = Math.abs(t.y) < 0.9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
      normal.addScaledVector(t, -normal.dot(t));

      normal.normalize();
      if (skip(d)) { run = null; continue; }
      if (!run) { run = []; runs.push(run); }
      const theta = 2*Math.PI*turnsPerUnit*d;

      const u = normal.clone().multiplyScalar(Math.cos(theta)).addScaledVector(binormal, Math.sin(theta)); // out from the axis
      const w = new THREE.Vector3().crossVectors(t, u);                                                   // round the tube
      const across = t.clone().multiplyScalar(lean).sub(w).normalize(); // the ribbon's width: across its path on the tube

    const faces = [

      { mesh: outer, from: [rIn, -halfWidth], to: [rOut, -halfWidth], normal: s => s.across.clone().negate() },
      { mesh: outer, from: [rOut, halfWidth], to: [rIn, halfWidth], normal: s => s.across },
      { mesh: inner, from: [rIn, halfWidth], to: [rIn, -halfWidth], normal: s => s.u.clone().negate() },
    ];

        const m = face.mesh, base = m.pos.length/3;

            m.nrm.push(n.x, n.y, n.z);

      });

      if (!m.idx.length) return null;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(m.pos, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(m.nrm, 3));
      geo.setIndex(m.idx);
      return geo;
    };
    return { outer: toGeometry(outer), inner: toGeometry(inner) };
  }
  // a pair of beams either side of `point` (across the track's heading), from the ground up to `topY`
  function addSupportBeams(geos, point, tangent, halfGap, topY, beamW) {
    if (topY < 0.5) return;

    if (side.lengthSq() < 1e-6) side.set(1,0,0); else side.normalize();

  // A station, built around the tube's centerline at `position`, always level and turned to the track's heading, in

  //  • a stadium-shaped platform deck just under the tube, ringed by a glowing trim line;
  //  • a glass vault rising from the deck's edge — a half-ellipse cross-section along the middle, closing into
  //    quarter-ellipsoid ends over the deck's rounded ends — which the tube runs straight through;
  //  • chrome ribs across the vault, a chrome spine along its ridge, a chrome portal ring where the tube pierces each
  //    end, and a small chrome orb and needle on top;
  //  • an entrance in each long side: a pair of dark glass doors set into the vault's curve, framed in chrome under a

  function buildStationParts(position, tangent, radius, mats) {

    const parts = [];

    for (let k=0;k<=midRows;k++) rows.push({ z: midRows ? -straightHalf + 2*straightHalf*k/midRows : 0, s: 1 });
    for (let k=1;k<=capRows;k++) { const phi = Math.PI/2*k/capRows; rows.push({ z: straightHalf + capLength*Math.sin(phi), s: Math.max(0.02, Math.cos(phi)) }); }

    const positions = [], indices = [];

        chrome.push(tubeAlong(up(0, doorTop, zL, 8), 0.12), tubeAlong(up(0, doorTop, zR, 8), 0.12)); // jambs
        chrome.push(tubeAlong(up(0, doorTop, 0, 8), 0.05)); // where the two doors meet
        chrome.push(tubeAlong([zL, zL/2, 0, zR/2, zR].map(z => vaultPoint(arc(doorTop), { z, s:1 }, 1.024)), 0.12)); // header
        // the landing and awning: boxes running from x0 out to x1 (away from the track, on this side)

        };

        const m = new THREE.Mesh(new THREE.OctahedronGeometry(1.1, 0), nodeUiMaterial(THREE.MeshBasicMaterial, { color:0xffd23d }));
        m.position.set(h.x,1.6,h.z);
        m.userData = { nodeId:id, handleKind:key, baseColor:0xffd23d };
        roadHandleGroup.add(asNodeUi(m));
        const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(n.x,1.5,n.z), new THREE.Vector3(h.x,1.5,h.z)]);
        roadHandleGroup.add(asNodeUi(new THREE.Line(lineGeo, nodeUiMaterial(THREE.LineBasicMaterial, { color:0xffd23d, opacity:0.5 }))));
      });
    });
    scene.add(roadHandleGroup);
  }

  function cleanupOrphanRoadNodes() {
    const used = new Set();
    roadLines.forEach(l => l.nodeIds.forEach(id => used.add(id)));
    Object.keys(roadNodes).forEach(id => { if (!used.has(id)) delete roadNodes[id]; });
  }

  // ---------------------------------------------------------- hover + insert-on-edge
  let hoveredMesh = null;
  function setHover(mesh) {
    if (hoveredMesh === mesh) return;
    if (hoveredMesh && hoveredMesh.material) {
      hoveredMesh.material.color.set(hoveredMesh.userData.baseColor !== undefined ? hoveredMesh.userData.baseColor : 0x3ddc97);
    }
    hoveredMesh = mesh;
    if (hoveredMesh && hoveredMesh.material) hoveredMesh.material.color.set(0xffffff);
  }

  const insertPreviewGeo = new THREE.BufferGeometry();
  const insertPreviewMarker = asNodeUi(new THREE.LineSegments(insertPreviewGeo, nodeUiMaterial(THREE.LineBasicMaterial, { color:0xffffff })));
  insertPreviewMarker.visible = false;
  scene.add(insertPreviewMarker);
  function updateInsertPreviewGeometry(point, angle) {
    const r = 1.8;
    const rotAngle = angle;
    const cos = Math.cos(rotAngle), sin = Math.sin(rotAngle);
    const rot = (lx,lz) => ({ x: lx*cos - lz*sin, z: lx*sin + lz*cos });
    const c1=rot(-r,-r), c2=rot(r,r), c3=rot(-r,r), c4=rot(r,-r);
    const y = point.y!=null ? point.y : 1.4; // train insert points sit up on the tube
    setLinePoints(insertPreviewGeo, [
      new THREE.Vector3(point.x+c1.x, y, point.z+c1.z), new THREE.Vector3(point.x+c2.x, y, point.z+c2.z),
      new THREE.Vector3(point.x+c3.x, y, point.z+c3.z), new THREE.Vector3(point.x+c4.x, y, point.z+c4.z)
    ]);
  }
  function findNearestEdge(gp, zoneThreshold) {
    let best = null;
    if (currentTool==='road') {
      roadLines.forEach(line => {
        const th = Math.max((line.width||DEFAULT_ROAD_WIDTH)/2+3, 6);
        const pts = line.nodeIds.map(id=>roadNodes[id]).filter(Boolean);
        for (let i=0;i<pts.length-1;i++) {
          const a=pts[i], b=pts[i+1];
          const r = nearestPointOnEdgeTessellated(gp,a,b);
          if (r.dist<=th && (!best || r.dist<best.dist)) best = { kind:'road', line, index:i, point:r.point, dist:r.dist, angle:Math.atan2(b.z-a.z,b.x-a.x) };
        }
      });
    } else if (currentTool==='zone') {
      zones.forEach(zone => {
        const n = zone.points.length;
        if (n<2) return;
        const edgeCount = zone.closed ? n : n-1;
        for (let i=0;i<edgeCount;i++) {
          const a=zone.points[i], b=zone.points[(i+1)%n];
          const r = nearestPointOnEdgeTessellated(gp,a,b);
          if (r.dist<=zoneThreshold && (!best || r.dist<best.dist)) best = { kind:'zone', zone, index:i, point:r.point, dist:r.dist, angle:Math.atan2(b.z-a.z,b.x-a.x) };
        }
      });
    }
    return best;
  }
  function insertNodeOnEdge(found) {
    if (found.kind==='train') {
      const id = 'n'+(roadNodeSeq++);
      roadNodes[id] = { x:found.point.x, y:found.point.y, z:found.point.z, type:'poly', handleIn:null, handleOut:null };
      found.line.nodeIds.splice(found.index+1, 0, id);
      rebuildRoadMeshes(); renderHierarchy();
    } else if (found.kind==='road') {
      const pt = snapPointToGrid(found.point, 'road');
      const id = 'n'+(roadNodeSeq++);
      roadNodes[id] = { x:pt.x, z:pt.z, type:'poly', handleIn:null, handleOut:null };
      found.line.nodeIds.splice(found.index+1, 0, id);
      rebuildRoadMeshes(); zones.forEach(subdivideZone); renderHierarchy();
    } else {
      const pt = snapPointToGrid(found.point, 'zone');
      found.zone.points.splice(found.index+1, 0, { x:pt.x, z:pt.z, type:'poly', handleIn:null, handleOut:null });
      subdivideZonesFrom(found.zone);
      rebuildZoneVisual(found.zone);
      renderHierarchy();
    }
    insertPreviewMarker.visible = false;
    pendingInsert = null;
  }

  // ---------------------------------------------------------- zone rendering + generation
  function rebuildZoneVisual(zone) {
    if (zone.outlineGroup) { scene.remove(zone.outlineGroup); disposeObject(zone.outlineGroup); }
    const g = new THREE.Group();
    const markerGroup = new THREE.Group();
    const tessPts = zone.points.length>=2 ? (zone.closed ? tessellateClosedPath(zone.points) : tessellateOpenPath(zone.points)) : zone.points;
    if (zone.points.length>=3) {
      const shape = new THREE.Shape();
      tessPts.forEach((p,i) => { const sx=p.x, sy=-p.z; if (i===0) shape.moveTo(sx,sy); else shape.lineTo(sx,sy); });
      shape.closePath();
      const fillGeo = new THREE.ShapeGeometry(shape);
      const isSel = selection.type==='zone' && selection.id===zone.id;
      const fillMat = new THREE.MeshBasicMaterial({ color: isSel?0xffffff:0x3ddc97, transparent:true, opacity: isSel?0.13:0.07, side:THREE.DoubleSide, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-8, polygonOffsetUnits:-8 });
      const fill = new THREE.Mesh(fillGeo,fillMat);
      fill.rotation.x=-Math.PI/2; fill.position.y=Y_ZONE_FILL;
      fill.userData = { zoneId: zone.id, isZoneFill:true };
      g.add(fill);
    }
    if (zone.points.length>=2) {
      const pts = tessPts.map(p => new THREE.Vector3(p.x,Y_ZONE_LINE,p.z));
      if (zone.closed) pts.push(pts[0].clone());
      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      const isSel = selection.type==='zone' && selection.id===zone.id;
      const lineMat = new THREE.LineBasicMaterial({ color: isSel?0xffffff:0x3ddc97 });
      const lineObj = new THREE.Line(lineGeo,lineMat);
      lineObj.userData = { zoneId: zone.id, isZoneLine:true };
      g.add(lineObj);
    }
    zone.points.forEach((p,i) => {
      const isStart = i===0 && zone.drawing;
      const baseColor = isStart?0xffd23d:0x3ddc97;
      const geo = new THREE.SphereGeometry(isStart?2.0:1.5,12,12);
      const mat = nodeUiMaterial(THREE.MeshBasicMaterial, { color: baseColor });
      const m = new THREE.Mesh(geo,mat);
      m.position.set(p.x,1.4,p.z);
      m.userData = { zoneId: zone.id, vertexIndex: i, baseColor };
      markerGroup.add(asNodeUi(m));
      if (p.type==='spline') {
        ['handleIn','handleOut'].forEach(key => {
          const h = p[key];
          if (!h) return;
          const hgeo = new THREE.OctahedronGeometry(0.9, 0);
          const hmat = nodeUiMaterial(THREE.MeshBasicMaterial, { color:0xffd23d });
          const hm = new THREE.Mesh(hgeo,hmat);
          hm.position.set(h.x,1.4,h.z);
          hm.userData = { zoneId: zone.id, ownerIndex: i, handleKind:key, baseColor:0xffd23d };
          markerGroup.add(asNodeUi(hm));
          const clGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p.x,1.35,p.z), new THREE.Vector3(h.x,1.35,h.z)]);
          markerGroup.add(asNodeUi(new THREE.Line(clGeo, nodeUiMaterial(THREE.LineBasicMaterial, { color:0xffd23d, opacity:0.5 }))));
        });
      }
    });
    markerGroup.visible = (interactionMode==='node');
    g.add(markerGroup);
    zone.markerGroup = markerGroup;
    g.visible = (interactionMode==='node');
    zone.outlineGroup = g;
    scene.add(g);
  }

  function scalePolygonAroundCentroid(poly, scale) {
    const c = centroid(poly);
    return poly.map(p => ({ x:c.x+(p.x-c.x)*scale, z:c.z+(p.z-c.z)*scale }));
  }
  function makeExtrudeRaw(poly, height) {
    const shape = new THREE.Shape();
    poly.forEach((p,i) => { const sx=p.x, sy=-p.z; if (i===0) shape.moveTo(sx,sy); else shape.lineTo(sx,sy); });
    shape.closePath();
    return new THREE.ExtrudeGeometry(shape, { depth:height, bevelEnabled:false });
  }
  function extrudeFootprintGeo(poly, height, gradient, tileSize) {
    const raw = makeExtrudeRaw(poly, height);
    const caps = extractCapGeometry(raw);
    const walls = buildWallGeometry(poly, height, gradient, tileSize);
    return mergeGeometries(caps, walls);
  }

  // ---------------------------------------------------------- surface detail (Y2K greebles/bands/rings)
  function addRingAccent(group, c, ringRadius, tube, zHeight, colorHex) {
    const ringGeo = new THREE.TorusGeometry(Math.max(0.6,ringRadius), Math.max(0.06,tube), 8, 28);
    const ringMat = new THREE.MeshStandardMaterial({ color:colorHex, roughness:0.3, metalness:0.6, emissive:colorHex, emissiveIntensity:0.3 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.set(c.x, -c.z, zHeight);
    ring.castShadow = true;
    ring.name = 'Building';
    group.add(ring);
  }
  function addAccentBand(group, poly, bandBottom, bandColor, rng) {
    const bandH = 0.35 + rng()*0.5;
    // Push the band's footprint out past the main wall face (a real belt-course ledge) instead
    // of tracing the exact same outline flush against it — that coplanar surface is what was
    // z-fighting with the wall behind it.
    const bandPoly = insetPolygon(poly, -(0.12 + rng()*0.1));
    const bandGeo = extrudeFootprintGeo(bandPoly, bandH); // capped, so the protruding ledge doesn't show an open top/bottom rim
    const bandMat = new THREE.MeshStandardMaterial({ color:bandColor, roughness:0.3, metalness:0.6, emissive:bandColor, emissiveIntensity:0.25 });
    const band = new THREE.Mesh(bandGeo, bandMat);
    band.position.z = bandBottom;
    band.castShadow = true; band.name = 'Building';
    group.add(band);
  }
  function addRooftopGreebles(group, poly, height, rng) {
    const count = 2 + Math.floor(rng()*5);
    let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
    poly.forEach(p => { if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.z<minZ)minZ=p.z; if(p.z>maxZ)maxZ=p.z; });
    let placed=0, attempts=0;
    while (placed<count && attempts<count*12) {
      attempts++;
      const pt = { x:minX+rng()*(maxX-minX), z:minZ+rng()*(maxZ-minZ) };
      if (!pointInPolygon(pt, poly)) continue;
      if (distToPolygonBoundary(pt, poly) < 0.8) continue;
      const kind = rng();
      let obj;
      if (kind < 0.18) {
        // AC/HVAC unit
        const w=0.5+rng()*0.7, d=0.5+rng()*0.7, gh=0.3+rng()*0.6;
        obj = new THREE.Mesh(new THREE.BoxGeometry(w,d,gh), new THREE.MeshStandardMaterial({ color:0x6b6e73, roughness:0.8, metalness:0.2, flatShading:true }));
        obj.rotation.x = Math.PI/2;
        obj.position.set(pt.x, -pt.z, height+gh/2);
      } else if (kind < 0.33) {
        // single vent pipe
        const r=0.15+rng()*0.2, gh=0.6+rng()*1.4;
        obj = new THREE.Mesh(new THREE.CylinderGeometry(r,r,gh,6), new THREE.MeshStandardMaterial({ color:0x888c92, roughness:0.5, metalness:0.4, flatShading:true }));
        obj.rotation.x = Math.PI/2;
        obj.position.set(pt.x, -pt.z, height+gh/2);
      } else if (kind < 0.46) {
        // dish antenna on a mast
        const dishR=0.35+rng()*0.35, mastH=0.25+rng()*0.3;
        obj = new THREE.Group();
        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,mastH,5), new THREE.MeshStandardMaterial({ color:0x555a60 }));
        mast.position.y = mastH/2;
        const dish = new THREE.Mesh(new THREE.ConeGeometry(dishR, dishR*0.55, 12, 1, true), new THREE.MeshStandardMaterial({ color:0xd8dade, roughness:0.4, metalness:0.3, side:THREE.DoubleSide }));
        dish.rotation.x = Math.PI*0.62;
        dish.position.y = mastH + dishR*0.2;
        obj.add(mast, dish);
        obj.rotation.x = Math.PI/2;
        obj.position.set(pt.x, -pt.z, height);
      } else if (kind < 0.62) {
        // squat water tank with a conical lid
        const tankR = 0.45+rng()*0.3, tankH = 0.8+rng()*0.6, lidH = tankR*0.7;
        obj = new THREE.Group();
        const tankMat = new THREE.MeshStandardMaterial({ color:0x8a8f96, roughness:0.6, metalness:0.35, flatShading:true });
        const tank = new THREE.Mesh(new THREE.CylinderGeometry(tankR,tankR,tankH,10), tankMat);
        tank.position.y = tankH/2;
        const lid = new THREE.Mesh(new THREE.ConeGeometry(tankR*1.05, lidH, 10), new THREE.MeshStandardMaterial({ color:0x6f747a, roughness:0.6, metalness:0.3, flatShading:true }));
        lid.position.y = tankH + lidH/2;
        obj.add(tank, lid);
        obj.rotation.x = Math.PI/2;
        obj.position.set(pt.x, -pt.z, height);
      } else if (kind < 0.77) {
        // clustered vent pipes
        obj = new THREE.Group();
        const clusterMat = new THREE.MeshStandardMaterial({ color:0x75797f, roughness:0.55, metalness:0.4, flatShading:true });
        const n = 3 + Math.floor(rng()*2);
        for (let i=0;i<n;i++) {
          const r=0.08+rng()*0.08, gh=0.35+rng()*0.5;
          const pipe = new THREE.Mesh(new THREE.CylinderGeometry(r,r,gh,6), clusterMat);
          const off = 0.22+rng()*0.14, ang = rng()*Math.PI*2;
          pipe.position.set(Math.cos(ang)*off, gh/2, Math.sin(ang)*off);
          obj.add(pipe);
        }
        obj.rotation.x = Math.PI/2;
        obj.position.set(pt.x, -pt.z, height);
      } else if (kind < 0.87) {
        // helipad marking
        const padR = 1.1+rng()*0.6, padH = 0.06;
        obj = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(padR,padR,padH,20), new THREE.MeshStandardMaterial({ color:0x2b2e33, roughness:0.7, metalness:0.1 }));
        base.position.y = padH/2;
        const marking = new THREE.Mesh(new THREE.CylinderGeometry(padR*0.62,padR*0.62,padH*1.6,20), new THREE.MeshStandardMaterial({ color:0xc7cad0, roughness:0.6, metalness:0.1, emissive:0xc7cad0, emissiveIntensity:0.25 }));
        marking.position.y = padH*1.6/2 + 0.001;
        obj.add(base, marking);
        obj.rotation.x = Math.PI/2;
        obj.position.set(pt.x, -pt.z, height);
      } else {
        // row of angled solar panels
        obj = new THREE.Group();
        const panelMat = new THREE.MeshStandardMaterial({ color:0x1c2b3d, roughness:0.35, metalness:0.5, side:THREE.DoubleSide });
        const railMat = new THREE.MeshStandardMaterial({ color:0x555a60, roughness:0.6, metalness:0.4 });
        const n = 3 + Math.floor(rng()*3);
        const panelW = 0.55, panelLen = 0.9+rng()*0.4, tilt = 0.45+rng()*0.25, gap = 0.18;
        const rowAngle = rng()*Math.PI*2;
        const rowGroup = new THREE.Group();
        for (let i=0;i<n;i++) {
          const along = i*(panelW+gap);
          const rail = new THREE.Mesh(new THREE.BoxGeometry(panelW, 0.05, panelLen), panelMat);
          rail.position.set(along, panelLen*0.5*Math.sin(tilt), 0);
          rail.rotation.x = tilt;
          const support = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.3,0.06), railMat);
          support.position.set(along, 0.15, 0);
          rowGroup.add(support, rail);
        }
        rowGroup.position.set(-(n-1)*(panelW+gap)/2, 0, 0);
        rowGroup.rotation.y = rowAngle;
        obj.add(rowGroup);
        obj.rotation.x = Math.PI/2;
        obj.position.set(pt.x, -pt.z, height);
      }
      obj.traverse(o => { if (o.isMesh) { o.name='Building'; o.castShadow=true; } });
      group.add(obj);
      placed++;
    }
  }

  // Below: post-hoc facade/structure detail. Each of these ADDS geometry around the already-
  // built massing (never modifies it), so they can be wired in as a flat list of independent,
  // gated calls at the end of makeBuildingMesh rather than threaded through every branch of the
  // massing selection above. Repeated small pieces (ribs, balcony ledges) are merged into one
  // mesh per building via mergeGeometryList, so obj/poly count doesn't balloon with detail.
  function addVerticalRibs(group, poly, zBottom, zHeight, rng, ribColor) {
    const chunky = rng() < 0.5; // chunky structural fins vs frequent thin curtain-wall seams
    const ribWidth = chunky ? 0.28+rng()*0.14 : 0.09+rng()*0.06;
    const ribDepth = chunky ? 0.16+rng()*0.1  : 0.05+rng()*0.03;
    const spacing  = chunky ? 2.4+rng()*1.0   : 1.0+rng()*0.5;
    const ribSpanH = zHeight * (0.86+rng()*0.1);
    const zCenter = zBottom + zHeight/2;
    const c = centroid(poly), clx=c.x, cly=-c.z;
    const n = poly.length;
    const geos = [];
    for (let i=0;i<n && geos.length<40;i++) {
      const pa=poly[i], pb=poly[(i+1)%n];
      const ax=pa.x, ay=-pa.z, bx=pb.x, by=-pb.z;
      const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
      const ux=dx/len, uy=dy/len;
      let nx=dy/len, ny=-dx/len;
      const midx=(ax+bx)/2, midy=(ay+by)/2;
      if (((midx-clx)*nx+(midy-cly)*ny) < 0) { nx=-nx; ny=-ny; }
      if (len < spacing*1.3) continue;
      const count = Math.max(1, Math.floor(len/spacing));
      const used = count*spacing;
      const start = (len-used)/2 + spacing/2;
      const edgeAngle = Math.atan2(uy,ux);
      for (let k=0;k<count && geos.length<40;k++) {
        const t = start + k*spacing;
        const px = ax+ux*t + nx*(ribDepth/2-0.03);
        const py = ay+uy*t + ny*(ribDepth/2-0.03);
        // authored as (alongEdge, alongNormal, height) then rotated flat into place — a plain
        // rotateZ suffices since the box's local Z axis (height) never needs to move.
        const g = new THREE.BoxGeometry(ribWidth, ribDepth, ribSpanH);
        g.rotateZ(edgeAngle);
        g.translate(px, py, zCenter);
        geos.push(g);
      }
    }
    if (!geos.length) return;
    const mesh = new THREE.Mesh(mergeGeometryList(geos), new THREE.MeshStandardMaterial({ color:ribColor, roughness:0.6, metalness:0.3, flatShading:true }));
    mesh.castShadow = true; mesh.name = 'Building';
    group.add(mesh);
  }
  function addBalconies(group, poly, zBottom, zHeight, rng, balColor) {
    const n = poly.length;
    if (n < 3 || zHeight < 6) return;
    const c = centroid(poly), clx=c.x, cly=-c.z;
    const floorH = 3 + rng()*1.5;
    const floors = Math.floor(zHeight/floorH) - 1;
    if (floors < 1) return;
    const edgeCount = Math.min(n, 1+Math.floor(rng()*2));
    const chosen = new Set();
    while (chosen.size < edgeCount) chosen.add(Math.floor(rng()*n));
    const ledgeDepth = 0.7+rng()*0.5, ledgeH = 0.12, railH = 0.85+rng()*0.15, railThick = 0.06;
    const ledgeGeos = [], railGeos = [];
    chosen.forEach(i => {
      const pa=poly[i], pb=poly[(i+1)%n];
      const ax=pa.x, ay=-pa.z, bx=pb.x, by=-pb.z;
      const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
      if (len < 3) return;
      const ux=dx/len, uy=dy/len;
      let nx=dy/len, ny=-dx/len;
      const midx=(ax+bx)/2, midy=(ay+by)/2;
      if (((midx-clx)*nx+(midy-cly)*ny) < 0) { nx=-nx; ny=-ny; }
      const span = len*0.7;
      const edgeAngle = Math.atan2(uy,ux);
      for (let f=1; f<=floors; f++) {
        const floorZ = zBottom + f*floorH;
        if (floorZ > zBottom+zHeight-1) break;
        const lg = new THREE.BoxGeometry(span, ledgeDepth, ledgeH);
        lg.rotateZ(edgeAngle);
        lg.translate(midx+nx*(ledgeDepth/2-0.05), midy+ny*(ledgeDepth/2-0.05), floorZ);
        ledgeGeos.push(lg);
        const rg = new THREE.BoxGeometry(span, railThick, railH);
        rg.rotateZ(edgeAngle);
        rg.translate(midx+nx*(ledgeDepth-0.03), midy+ny*(ledgeDepth-0.03), floorZ+ledgeH/2+railH/2);
        railGeos.push(rg);
      }
    });
    if (!ledgeGeos.length) return;
    const ledgeMesh = new THREE.Mesh(mergeGeometryList(ledgeGeos), new THREE.MeshStandardMaterial({ color:balColor, roughness:0.7, metalness:0.15, flatShading:true }));
    ledgeMesh.castShadow = true; ledgeMesh.name = 'Building';
    group.add(ledgeMesh);
    const railMesh = new THREE.Mesh(mergeGeometryList(railGeos), new THREE.MeshStandardMaterial({ color:0x2a2d32, roughness:0.4, metalness:0.5, transparent:true, opacity:0.55 }));
    railMesh.castShadow = true; railMesh.name = 'Building';
    group.add(railMesh);
  }
  function addEntranceCanopy(group, poly, rng, canopyColor) {
    const n = poly.length;
    if (n < 3) return;
    const c = centroid(poly), clx=c.x, cly=-c.z;
    const i = Math.floor(rng()*n);
    const pa=poly[i], pb=poly[(i+1)%n];
    const ax=pa.x, ay=-pa.z, bx=pb.x, by=-pb.z;
    const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
    if (len < 2.5) return;
    const ux=dx/len, uy=dy/len;
    let nx=dy/len, ny=-dx/len;
    const midx=(ax+bx)/2, midy=(ay+by)/2;
    if (((midx-clx)*nx+(midy-cly)*ny) < 0) { nx=-nx; ny=-ny; }
    const canopyW = Math.min(len*0.5, 2.5+rng()*1.5);
    const canopyDepth = 1.4+rng()*1.0;
    const canopyH = 0.18;
    const zCenter = 2.6+rng()*0.6;
    const edgeAngle = Math.atan2(uy,ux);
    const geo = new THREE.BoxGeometry(canopyW, canopyDepth, canopyH);
    geo.rotateZ(edgeAngle);
    geo.translate(midx+nx*canopyDepth/2, midy+ny*canopyDepth/2, zCenter);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:canopyColor, roughness:0.4, metalness:0.5, flatShading:true }));

      positions.push(ax,ay,0, bx,by,0, apx,apy,apz);

    const n = Math.min(poly.length, GRASS_MAX_EDGE_POINTS);

          uniform int uBeachCount;
          uniform float uBeachWidth;
          float grassHash(vec2 p) {
            p = fract(p*vec2(123.34, 456.21));
            p += dot(p, p+45.32);
            return fract(p.x*p.y);
          }
          float grassNoise(vec2 p) {
            vec2 i = floor(p), f = fract(p);
            float a = grassHash(i), b = grassHash(i+vec2(1.0,0.0));
            float c = grassHash(i+vec2(0.0,1.0)), d = grassHash(i+vec2(1.0,1.0));
            vec2 u = f*f*(3.0-2.0*f);
            return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;

            float v = 0.0, amp = 0.5;
            for (int i=0;i<4;i++) { v += amp*grassNoise(p); p *= 2.03; amp *= 0.5; }
            return v;
          }
          // shortest distance from p to the segment a-b
          float grassDistToSegment(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p-a, ba = b-a;
            float h = clamp(dot(pa,ba)/max(dot(ba,ba), 1e-6), 0.0, 1.0);
            return length(pa - ba*h);

          // walks every edge since a zone can be concave, where "nearest edge" isn't obvious
          float grassDistToZoneEdge(vec2 p) {
            float minDist = 1e9;
            for (int i=0; i<GRASS_MAX_EDGE_POINTS; i++) {
              if (i >= uZoneEdgeCount) break;
              int j = i+1;
              if (j >= uZoneEdgeCount) j = 0;
              minDist = min(minDist, grassDistToSegment(p, uZoneEdgePoints[i], uZoneEdgePoints[j]));
            }
            return minDist;
          }
        `)
        .replace('#include <color_fragment>', `
          #include <color_fragment>

            float n = grassFbm(gp);
            float fine = grassNoise(gp*6.3);
            // Grayscale, not green — the grass tint is what actually colors this (diffuseColor
            // already carries it going into this block), so keeping the base neutral means the
            // tint you pick is close to the final rendered color instead of being muddied by
            // multiplying against an inherent green baked in here.
            // uGrassNoiseStrength scales the contrast around a fixed mid-grey: 0 collapses both
            // the coarse patches and the fine grain to perfectly flat, 1 matches the original
            // fixed contrast, and above 1 exaggerates it into a rougher, more mottled look.
            float grassMid = 0.59;

            // uZoneEdgeFalloff world units so it reads as a soft vignette, not a hard band
            float edgeDist = grassDistToZoneEdge(vGrassWorldPos.xz);
            float edgeT = smoothstep(0.0, uZoneEdgeFalloff, edgeDist);
            grassColor *= mix(uZoneEdgeDarken, 1.0, edgeT);
            diffuseColor.rgb *= grassColor;
            // sand where the park meets water: strongest (and darker, still wet) at the water's edge, fading back into
            // grass over about uBeachWidth units, with a ragged inland edge rather than a ruler-straight one
            if (uBeachCount > 0) {
              float beachDistance = 1e9;
              for (int i=0; i<GRASS_MAX_BEACH; i++) {
                if (i >= uBeachCount) break;
                beachDistance = min(beachDistance, grassDistToSegment(vGrassWorldPos.xz, uBeachSegments[i].xy, uBeachSegments[i].zw));
              }
              float reach = uBeachWidth*(0.75 + 0.5*grassNoise(vGrassWorldPos.xz*0.12));

              diffuseColor.rgb = mix(diffuseColor.rgb, sand, sandT);
            }
          }
        `);
    };
  }
  // `cutouts` (optional Clipper paths): areas to leave out of the surface — roads, and zones higher up the zone list (see

  function makeFlatZoneMesh(poly, color, y, name, customShader, cutouts) {
    const mat = new THREE.MeshStandardMaterial({ color, roughness:1, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 });
    if (customShader) customShader(mat);
    let mesh;
    if (cutouts && cutouts.length) {
      // the surface is the outline minus the cut-outs — possibly in several pieces, or with holes where a road loop or a
      // smaller zone above sits inside it
      const builder = createMeshBuilder();
      builder.addTops(clipPolygons(ClipperLib.ClipType.ctDifference, [toClipperPath(poly)], cutouts, true), y);
      const geo = builder.build();
      if (!geo) return null;
      mesh = new THREE.Mesh(geo, mat);
    } else {
      const shape = new THREE.Shape();
      poly.forEach((p,i) => { const sx=p.x, sy=-p.z; if (i===0) shape.moveTo(sx,sy); else shape.lineTo(sx,sy); });
      shape.closePath();
      mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat);
      mesh.rotation.x=-Math.PI/2; mesh.position.y=y;
    }
    mesh.receiveShadow=true;
    mesh.name=name;
    return mesh;
  }
  function makeTreeMesh(variant, scale, rng, tintColor) {
    const group = new THREE.Group();
    const trunkH = 1.0*scale, trunkR = 0.12*scale;
    const trunkGeo = new THREE.CylinderGeometry(trunkR*0.7, trunkR, trunkH, 8);
    const trunkMat = new THREE.MeshStandardMaterial({ color:0x5b4632, roughness:0.9 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);

    group.add(trunk);

    // real variety from sunlit to shaded — the tree tint is what actually colors this (see the
    // multiply below), so keeping the base neutral means the tint you pick closely matches the
    // final rendered color instead of being muddied by multiplying against a baked-in green.
    const foliageColor = new THREE.Color().setHSL(0, 0, THREE.MathUtils.clamp(0.55 + (rng()-0.5)*0.3, 0.25, 0.85));

    // pattern as the park's grass tint — white leaves the rolled grayscale color untouched, so

    foliageColor.multiply(new THREE.Color(tintColor!=null ? tintColor : 0xffffff));

      const r1=0.52*scale, r2=0.36*scale;

      m1.position.y = trunkH + r1*0.75;
      const m2 = new THREE.Mesh(new THREE.IcosahedronGeometry(r2,1), foliageMat);
      m2.position.y = trunkH + r1*1.15 + r2*0.6;

  // `cutouts` are cut out of the park's grass; `blockers` (cut-outs plus paths) are where trees can't go
  function generateParkContent(zone, poly, cutouts, blockers) {

    // where the park meets water, its grass turns to sand along that edge (see applyGrassNoiseShader)
    const ownArea = clipPolygons(ClipperLib.ClipType.ctDifference, [toClipperPath(poly)], cutouts);
    const beach = sharedEdgeSegmentsWith(ownArea, getWaterRegion(), GRASS_MAX_BEACH_SEGMENTS);
    const floor = makeParkMesh(poly, resolveParkTint(zone), resolveGrassNoiseStrength(zone), cutouts, beach);
    if (floor) { floor.name = 'ParkFloor'; zone.buildingsGroup.add(floor); }

    const s = zone.settings;
    // trees stand clear of roads, paths and zones above by the canopy radius of the biggest tree this park can grow
    // (the fir's bottom tier is the widest canopy, at 0.62 × tree scale)
    const treeBlockers = blockers || cutouts;
    const inCutout = createRegionTester(treeBlockers.length ? offsetPaths(treeBlockers, 0.62*s.treeSizeMax, ClipperLib.JoinType.jtRound) : []);

    let attempts = 0;
    while (placed.length<targetCount && attempts<maxAttempts) {
      attempts++;

      if (!pointInPolygon(pt, poly)) continue;
      if (distToPolygonBoundary(pt, poly) < s.treeSetback) continue;
      if (inCutout(pt.x, pt.z) || onBeach(pt.x, pt.z)) continue;
      let tooClose = false;
      for (const p of placed) { if (Math.hypot(p.x-pt.x, p.z-pt.z) < minSpacing) { tooClose=true; break; } }
      if (tooClose) continue;

    if (s.fence !== false) {

      if (fence) zone.buildingsGroup.add(fence);
    }
  }
  // ---------------------------------------------------------- plazas
  // A plaza is a paved square: tiles or herringbone brick drawn by a shader in world space (so the pattern runs on unbroken
  // across the whole plaza), edged with a darker band of paving. Lamp posts — lit after dark, like windows — stand around its
  // edge with benches between them, trees grow in square planters, and a fountain sits at the most open spot, if there's
  // room for one.
  const PLAZA_COLORS = [0xb7b0a4, 0xc4a88a, 0x9c9fa4, 0xd6cfc0];
  const Y_PLAZA = 0.07;
  const PLAZA_LAMP_SPACING = 13;
  const PAVING_FRAGMENT_PARS = `
    varying vec3 vPaveWorldPos;
    uniform int uPavePattern;
    uniform float uPaveScale;
    float paveHash(vec2 p) { p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
  `;
  const PAVING_COLOR_FRAGMENT = `
    {
      vec2 wp = vPaveWorldPos.xz;
      float edgeDist = -1.0;
      vec2 id = vec2(0.0);
      if (uPavePattern == 1) {
        // herringbone: 2:1 bricks laid at 45 degrees. In brick units, horizontal bricks cover [k, k+2] x [k+4m, k+4m+1] and
        // vertical ones [k, k+1] x [k+4m+1, k+4m+3] — together they tile the plane, so a point is in exactly one of them.
        float unit = 0.6*uPaveScale;
        vec2 p = vec2(wp.x + wp.y, wp.y - wp.x)*0.70710678/unit;
        float k1 = floor(p.x);
        for (int j=0; j<2; j++) {
          float k = k1 - float(j), t = p.y - k, m = floor(t/4.0), v = t - 4.0*m, u = p.x - k;
          if (edgeDist < 0.0 && v < 1.0) { edgeDist = min(min(u, 2.0-u), min(v, 1.0-v)); id = vec2(k, m*2.0); }
        }
        if (edgeDist < 0.0) {
          float t = p.y - k1 - 1.0, m = floor(t/4.0), v = t - 4.0*m, u = p.x - k1;
          edgeDist = min(min(u, 1.0-u), min(v, 2.0-v)); id = vec2(k1, m*2.0 + 1.0);
        }
        edgeDist *= unit;
      } else {
        float size = 2.4*uPaveScale;
        vec2 p = wp/size, f = fract(p);
        id = floor(p);
        edgeDist = min(min(f.x, 1.0-f.x), min(f.y, 1.0-f.y))*size;
      }
      float grout = smoothstep(0.03, 0.08, edgeDist);
      float tint = 0.9 + 0.2*paveHash(id + 17.0);

  function applyPavingShader(mat, pattern, scale) {

      shader.uniforms.uPaveScale = { value: scale || 1 };
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vPaveWorldPos;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvPaveWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');

        .replace('#include <common>', '#include <common>\n' + PAVING_FRAGMENT_PARS)
        .replace('#include <color_fragment>', '#include <color_fragment>\n' + PAVING_COLOR_FRAGMENT);
    };
  }
  // A round stone fountain of radius r centered at c ({x,z}), standing on the plaza.
  function buildFountain(c, r) {

    const rimH = 0.65, rimW = 0.35, inner = r - rimW;
    const place = (mesh, y) => { mesh.position.set(c.x, Y_PLAZA + y, c.z); mesh.castShadow = true; mesh.receiveShadow = true; group.add(mesh); return mesh; };
    place(new THREE.Mesh(new THREE.CylinderGeometry(r, r, rimH, 48, 1, true), stone), rimH/2);
    place(new THREE.Mesh(new THREE.CylinderGeometry(inner, inner, rimH, 48, 1, true), stone), rimH/2);
    place(new THREE.Mesh(new THREE.RingGeometry(inner, r, 48).rotateX(-Math.PI/2), stone), rimH);

    }

    place(new THREE.Mesh(new THREE.CylinderGeometry(r*0.1, r*0.15, 1.5, 16), stone), 0.75);
    place(new THREE.Mesh(new THREE.CylinderGeometry(r*0.34, r*0.2, 0.28, 24), stone), 1.64);
    place(new THREE.Mesh(new THREE.CylinderGeometry(r*0.05, r*0.08, 0.7, 12), stone), 2.1);

  }
  // `cutouts` are cut out of the paving; `blockers` (cut-outs plus paths) are where nothing's placed

    offsetPaths(area, -2.2, jtMiter).forEach(path => {

      pts.forEach((a, i) => {

      const tree = makeTreeMesh(1, 1.4 + rng()*0.7, rng, resolveTreeTint(zone));
      tree.position.set(x, Y_PLAZA + 0.55, z);
      tree.rotation.y = rng()*Math.PI*2;
      zone.buildingsGroup.add(tree);

    const furnitureGeo = furniture.build();
    if (furnitureGeo) {
      const mesh = new THREE.Mesh(furnitureGeo, new THREE.MeshStandardMaterial({ color: 0x4a4d52, roughness: 0.7, metalness: 0.2 }));

    if (headGeo) {

  }

  // ---------------------------------------------------------- farmland
  // Farmland is split into fields, like lots, with dirt tracks between them. Each field grows a crop — drawn by a shader as
  // rows running along the field's longer side, with slow patches of lighter and darker growth across it — and some are
  // lined with hedgerows, as is the farmland's edge (with gaps where roads and paths come through). A farmstead — a barn with
  // a silo and a shed — stands in some of the bigger fields.
  const FARM_TRACK_COLOR = 0x8f7b5e;
  const CROPS = [
    { color:0xd9bc5c, spacing:0.9, contrast:0.16 },  // wheat
    { color:0xcfc47e, spacing:0.8, contrast:0.14 },  // barley
    { color:0x86ad48, spacing:1.4, contrast:0.3 },   // leafy crop
    { color:0x9cbf5c, spacing:1.7, contrast:0.5 },   // young shoots, with soil showing between the rows
    { color:0x7d5d3f, spacing:1.1, contrast:0.35 },  // ploughed soil
    { color:0xd6c554, spacing:0.9, contrast:0.1 },   // rapeseed
    { color:0x9588ad, spacing:1.8, contrast:0.4 },   // lavender
    { color:0x93b862, spacing:3.0, contrast:0.06 },  // pasture
  ];
  const CROP_FRAGMENT_PARS = `
    varying vec3 vCropWorldPos;
    uniform vec2 uRowDir;
    uniform float uRowSpacing;
    uniform float uRowContrast;
    float cropHash(vec2 p) { p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
    float cropNoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      float a = cropHash(i), b = cropHash(i+vec2(1.0,0.0)), c = cropHash(i+vec2(0.0,1.0)), d = cropHash(i+vec2(1.0,1.0));
      vec2 u = f*f*(3.0-2.0*f);

    }
  `;
  const CROP_COLOR_FRAGMENT = `
    {
      vec2 wp = vCropWorldPos.xz;
      float ridge = smoothstep(0.15, 0.85, abs(fract(dot(wp, uRowDir)/uRowSpacing) - 0.5)*2.0);
      float patches = cropNoise(wp*0.06)*0.6 + cropNoise(wp*0.23)*0.4;
      vec3 c = diffuseColor.rgb*mix(1.0 - uRowContrast, 1.0 + uRowContrast*0.35, ridge);
      c *= (0.86 + 0.28*patches)*(0.95 + 0.1*cropNoise(wp*2.7));
      diffuseColor.rgb = c;
    }
  `;
  // rows run across (dx, dz): the stripes are perpendicular to it
  function applyCropShader(mat, dx, dz, spacing, contrast) {
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uRowDir = { value: new THREE.Vector2(dx, dz) };
      shader.uniforms.uRowSpacing = { value: spacing };
      shader.uniforms.uRowContrast = { value: contrast };
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vCropWorldPos;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvCropWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\n' + CROP_FRAGMENT_PARS)

    };
  }
  // the long axis (unit vector) of a polygon's minimum-area bounding rectangle, with that rectangle
  function longAxisOf(poly) {
    const rect = minAreaRect(convexHull(poly));
    const angle = rect.width >= rect.height ? rect.angle : rect.angle + Math.PI/2;
    return { rect, dx: Math.cos(angle), dz: Math.sin(angle), halfLong: Math.max(rect.width, rect.height)/2, halfShort: Math.min(rect.width, rect.height)/2 };
  }
  // A mesh from a mesh builder, in a flat color — null if the builder's empty.
  function builderMesh(builder, color, name, opts) {
    const geo = builder.build();

    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.name = name;

  }
  // a gable roof over the rectangle centered on (cx, cz) with half-length L along (dx, dz) and half-width W across it,
  // its eaves at y0 and ridge `rise` above them; the sloped faces go in `roof`, the triangular gable ends in `walls`
  function addGableRoof(roof, walls, cx, cz, dx, dz, L, W, y0, rise) {
    const nx = -dz, nz = dx;
    const at = (s, w, y) => ({ x: cx + dx*s + nx*w, y, z: cz + dz*s + nz*w });
    [1, -1].forEach(side => {
      const len = Math.hypot(rise, W);

      walls.addQuad(at(L*side, -W, y0), at(L*side, W, y0), at(L*side, 0, y0+rise), at(L*side, 0, y0+rise), { x: dx*side, y: 0, z: dz*side });

  }
  function generateFarmlandContent(zone, poly, cutouts, blockers) {
    const s = zone.settings, rng = mulberry32(s.seed>>>0);
    const tracks = makeFlatZoneMesh(poly, FARM_TRACK_COLOR, Y_ZONE_GROUND, 'FarmTracks', null, cutouts);
    if (tracks) zone.buildingsGroup.add(tracks);
    const lots = [];
    const targetFields = Math.max(1, Math.round(s.fieldCount!=null ? s.fieldCount : 14));
    recursiveSubdivide(poly, 0, { minArea: Math.abs(polygonArea(poly))/targetFields, maxDepth: 9, jitter: 0.5, minSplitDim: 6 }, rng, lots);
    const fields = [];
    lots.forEach(lot => cutLotByCutouts(lot, blockers).pieces.forEach(piece => {

      const mesh = makeFlatZoneMesh(field, crop.color, Y_PARK, 'Field', mat => applyCropShader(mat, across ? axis.dx : -axis.dz, across ? axis.dz : axis.dx, crop.spacing, crop.contrast));

          const loop = fromClipperPath(path);

        });
      }
    });
    if (s.hedgerows !== false) zoneFenceLines(zone, poly, 0.6).forEach(hedgeAlong);
    const hedgeMesh = builderMesh(hedges, 0x4d6a33, 'Hedgerow', { roughness: 1 });
    if (hedgeMesh) zone.buildingsGroup.add(hedgeMesh);
    // farmsteads, in some of the larger fields
    if (s.farmsteads !== false && fields.length) {
      const bySize = fields.slice().sort((a, b) => Math.abs(polygonArea(b)) - Math.abs(polygonArea(a)));
      const count = Math.max(1, Math.round(fields.length/9));
      for (let i=0;i<count;i++) {
        const field = bySize[Math.min(bySize.length-1, Math.floor(rng()*Math.min(bySize.length, count*3)))];
        const spot = insetPolygonExact(field, 8)[0];
        if (!spot) continue;
        const c = centroid(spot);
        if (!pointInPolygon(c, spot)) continue;
        const { dx, dz } = longAxisOf(field), nx = -dz, nz = dx;
        const group = new THREE.Group();
        group.name = 'Building';
        const yard = createMeshBuilder(), barn = createMeshBuilder(), roof = createMeshBuilder(), silo = createMeshBuilder();
        yard.addBox(c.x, c.z, dx, dz, 10, 7.5, Y_PARK, Y_PARK + 0.04);
        barn.addBox(c.x, c.z, dx, dz, 6, 3.6, Y_PARK, Y_PARK + 4.2);
        addGableRoof(roof, barn, c.x, c.z, dx, dz, 6.3, 3.9, Y_PARK + 4.2, 2.6);
        const shed = { x: c.x - nx*6.5 + dx*2, z: c.z - nz*6.5 + dz*2 };
        barn.addBox(shed.x, shed.z, dx, dz, 2.4, 1.8, Y_PARK, Y_PARK + 2.4);
        addGableRoof(roof, barn, shed.x, shed.z, dx, dz, 2.6, 2.0, Y_PARK + 2.4, 1.1);
        [[yard, FARM_TRACK_COLOR, 'Farmyard'], [barn, 0x9d3d2f, 'Barn'], [roof, 0x4a4643, 'BarnRoof']].forEach(([builder, color, name]) => {
          const mesh = builderMesh(builder, color, name);
          if (mesh) group.add(mesh);
        });
        const siloMat = new THREE.MeshStandardMaterial({ color: 0xd3d6d8, roughness: 0.55, metalness: 0.1 });
        const siloAt = { x: c.x + dx*8.4 + nx*1.2, z: c.z + dz*8.4 + nz*1.2 };
        const body = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 9, 20), siloMat);
        body.position.set(siloAt.x, Y_PARK + 4.5, siloAt.z);
        const dome = new THREE.Mesh(new THREE.SphereGeometry(1.6, 20, 8, 0, Math.PI*2, 0, Math.PI/2), siloMat);
        dome.position.set(siloAt.x, Y_PARK + 9, siloAt.z);
        [body, dome].forEach(m => { m.castShadow = true; m.receiveShadow = true; m.name = 'Silo'; group.add(m); });
        zone.buildingsGroup.add(group);
      }
    }
  }

  // ---------------------------------------------------------- fences & railings
  // Fences (around parks, industrial lots) and railings (along bridges) are all built the same way: rails running along a
  // line, and posts spaced evenly along it — carried over from one segment to the next, so a curve made of many short
  // segments still gets evenly spaced posts rather than one at every bend.
  const PARK_FENCE_STYLE = { height:1.1, rails:[1.05, 0.6], railWidth:0.08, railHeight:0.08, postSize:0.14, postSpacing:2.5, color:0x3a3d38 };
  // one segment a→b ({x,z}) of a railing standing at baseY; `state` carries the distance since the last post between calls
  function addRailingSegment(builder, a, b, baseY, style, state) {
    const len = Math.hypot(b.x-a.x, b.z-a.z);
    if (len < 1e-3) return;
    const dx = (b.x-a.x)/len, dz = (b.z-a.z)/len;
    style.rails.forEach(h => builder.addBox((a.x+b.x)/2, (a.z+b.z)/2, dx, dz, len/2 + style.railWidth/2, style.railWidth/2, baseY+h-style.railHeight, baseY+h));
    let s = style.postSpacing - (state.carry!=null ? state.carry : style.postSpacing);
    for (; s <= len; s += style.postSpacing) builder.addBox(a.x+dx*s, a.z+dz*s, dx, dz, style.postSize/2, style.postSize/2, baseY, baseY+style.height);
    state.carry = len - (s - style.postSpacing);
  }
  // a mesh of railings along polylines ({x,z}[]), each ending in a post
  function buildRailingMesh(lines, baseY, style, name) {
    const builder = createMeshBuilder();
    lines.forEach(line => {
      const state = {};
      for (let i=0;i<line.length-1;i++) addRailingSegment(builder, line[i], line[i+1], baseY, style, state);
      const end = line[line.length-1], prev = line[line.length-2];
      const len = Math.hypot(end.x-prev.x, end.z-prev.z) || 1;
      if (state.carry > style.postSpacing*0.25) builder.addBox(end.x, end.z, (end.x-prev.x)/len, (end.z-prev.z)/len, style.postSize/2, style.postSize/2, baseY, baseY+style.height);
    });
    const geo = builder.build();
    if (!geo) return null;
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: style.color, roughness: style.roughness!=null ? style.roughness : 0.8, metalness: style.metalness || 0 }));
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.name = name;
    return mesh;
  }
  // The lines a fence around `poly` (a zone's outline) should follow: the edge of its area — the outline minus the zones
  // above it — pulled in by `inset`, with a gap wherever a road, river or path crosses it, and left off wherever it runs along
  // water (that edge is a beach or an embankment instead).
  function zoneFenceLines(zone, poly, inset) {

    if (!edge.length) return [];

    const reach = offsetPaths([toClipperPath(poly)], ZONE_CUTOUT_REACH + inset, ClipperLib.JoinType.jtRound);
    const crossings = clipPolygons(ctIntersection, clipPolygons(ctUnion, landCutFootprint, pathFootprint), reach);
    const water = clipPolygons(ctIntersection, getWaterRegion(), reach);
    const gaps = clipPolygons(ctUnion, crossings.length ? offsetPaths(crossings, 0.6, ClipperLib.JoinType.jtRound) : [],

    clipper.AddPaths(loops, ClipperLib.PolyType.ptSubject, false);

  }

  // ---------------------------------------------------------- water
  // Water zones and rivers are one body of water: their areas are unioned, so a river running into a lake joins it without
  // a seam. It sits sunk below the ground — the ground mesh has a hole cut where it is — at WATER_LEVEL, and it's edged by
  // banks: a sandy beach sloping down into the water wherever it meets a park, and a stone embankment wall everywhere else.
  // Roads and paths don't cut into it: where they cross, they're carried over on bridges (see "bridges").

  // sun and picks up the sky reflection, and it's colored by how far each point is from the waterline — deep blue-green in
  // the middle, lighter turquoise in the shallows, and a thin broken line of foam at the water's edge. Along a beach, the
  // shallows take on a sandy tint while the park's grass turns to sand along the same edge (see applyGrassNoiseShader), so
  // grass, sand and water blend into each other. Both shaders measure distance to shore edges passed in as fixed-size
  // lists of segments; to keep those lists short, the surface is built in square tiles, each told only about the shore
  // near it (see rebuildWater).
  const WATER_COLOR = 0x0d4a5a;       // deep water; the shallows are mixed in lighter by the shader
  const WATER_LEVEL = -1.2;           // the water's surface, below ground level
  const WATER_BANK_TOP = 0.05;        // banks start a hair above the ground, so zone floors meet them without a gap
  const WATER_BANK_BOTTOM = -1.6;     // and reach down past the surface (which is opaque)
  const BEACH_SLOPE_WIDTH = 3;        // how far out a beach slopes before it reaches the bottom of the bank
  // how far out along a beach its slope goes under the water — where the waterline and its foam are
  const BEACH_WATERLINE = BEACH_SLOPE_WIDTH*(WATER_BANK_TOP - WATER_LEVEL)/(WATER_BANK_TOP - WATER_BANK_BOTTOM);
  const WATER_BANK_COLOR = 0x6f6c66, WATER_BEACH_COLOR = 0xc9b387;

  const WATER_FRAGMENT_PARS = `
    #define WATER_MAX_SHORE ${WATER_MAX_SHORE_SEGMENTS}
    #define WATER_MAX_BEACH ${WATER_MAX_BEACH_SEGMENTS}
    varying vec3 vWaterWorldPos;
    uniform float uWaterTime;
    uniform vec4 uShoreSegments[WATER_MAX_SHORE];
    uniform int uShoreCount;
    uniform vec4 uBeachSegments[WATER_MAX_BEACH];
    uniform int uBeachCount;
    uniform float uBeachWaterline;
    float waterHash(vec2 p) { p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }

  const WATER_COLOR_FRAGMENT = `
    {
